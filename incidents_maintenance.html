<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>시설 유지보수 및 파손신고 관리 (통합형)</title>
    <style>
        :root { 
            --primary: #e83e8c; 
            --border: #dee2e6; 
            --bg: #f8f9fa; 
            --text-dark: #495057;
            --text-muted: #6c757d;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #fd7e14;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            background-color: var(--bg); 
        }
        
        .left-panel { width: 35%; background: white; border-right: 1px solid var(--border); padding: 25px; overflow-y: auto; box-sizing: border-box; }
        .right-panel { width: 65%; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; background: white; }
        .panel-title { font-size: 1.1rem; color: var(--primary); margin: 0 0 20px 0; border-bottom: 2px solid var(--primary); padding-bottom: 8px; font-weight: bold; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; color: var(--text-dark); }
        .form-control { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.88rem; box-sizing: border-box; }
        .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .file-upload-box {
            border: 2px dashed var(--border);
            border-radius: 4px;
            padding: 12px;
            text-align: center;
            background: var(--bg);
            cursor: pointer;
        }
        .file-upload-box:hover { border-color: var(--primary); }
        .file-preview-area { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; }
        .preview-img { width: 60px; height: 60px; border-radius: 4px; border: 1px solid var(--border); object-fit: cover; }
        
        .btn-box { margin-top: 15px; display: flex; gap: 8px; }
        /* 저장 버튼은 항상 화면에 남는다 — 입력칸이 늘어나도 아래로 밀려 사라지지 않는다.
           좌우 -25px 는 .left-panel 의 padding 을 상쇄해 칸을 가로로 꽉 채우기 위한 것. */
        .btn-box { position: sticky; bottom: 0; z-index: 5; background: #fff;
                   border-top: 1px solid var(--border);
                   padding: 10px 25px; margin-left: -25px; margin-right: -25px; margin-bottom: -25px;
                   box-shadow: 0 -5px 12px rgba(0,0,0,.07); }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 0.85rem; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-main { background: var(--primary); color: white; }
        .btn-sub { background: #6c757d; color: white; }
        
        .right-top { flex: 1; padding: 20px; overflow-y: auto; border-bottom: 1px solid var(--border); }
        .search-bar { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 15px; }
        
        .right-bottom { display: none; }
        .viewer-header { background: #dee2e6; padding: 6px 15px; font-size: 0.8rem; font-weight: bold; color: var(--text-dark); }
        .viewer-body { flex: 1; display: flex; justify-content: center; align-items: center; padding: 15px; overflow-y: auto; }
        .detail-card { width: 85%; font-size: 0.82rem; line-height: 1.6; color: #333; background: white; border-radius: 4px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .detail-card h4 { margin-top: 0; margin-bottom: 10px; }
        
        .excel-table-wrap { overflow: auto; border: 1px solid #bbc4cc; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th { background: #f1f3f5; border: 1px solid #bbc4cc; padding: 6px 8px; font-weight: 600; position: sticky; top: 0; text-align: center; color: #212529; white-space: nowrap; }
        td { border: 1px solid #ced4da; padding: 6px 8px; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f8f9fa; color: #333; }
        tr:hover { background-color: #e8f4fd; cursor: pointer; }
        
        .cell-text-center { text-align: center; }
        .cell-num-right { text-align: right; }
        
        .col-no { min-width: 50px; max-width: 65px; width: 55px; text-align: right; }
        .th-no { min-width: 50px; max-width: 65px; width: 55px; text-align: center; }
        
        .status-badge { font-weight: bold; padding: 2px 6px; border-radius: 3px; font-size: 0.75rem; }
        .status-process { color: var(--warning); background: #fff3cd; }
        .status-done { color: var(--success); background: #e8f5e9; }
    </style>
<script src="guard.js"></script>
</head>
<body>
    <div class="left-panel">
        <div class="panel-title">🔧 F. 시설유지보수/파손신고 관리</div>
        <form id="maintenanceForm" onsubmit="event.preventDefault(); submitMaintenanceModule();">
            <div style="display:flex;gap:14px;align-items:center;margin-bottom:10px;background:#f1f3f5;padding:7px 10px;border-radius:5px;font-size:.85rem">
                <label style="margin:0;cursor:pointer;font-weight:600"><input type="radio" name="incScope" value="room" checked onchange="onIncScopeChange()"> 호실</label>
                <label style="margin:0;cursor:pointer;font-weight:600"><input type="radio" name="incScope" value="common" onchange="onIncScopeChange()"> 🏢 공용부 (복도·공동화장실)</label>
            </div>

            <div class="form-group" id="incRoomBox">
                <label>대상 호실 (번호 입력 · 440 입력 시 4층 전체)</label>
                <input type="text" id="m_roomSearch" class="form-control" list="mRoomsDatalist"
                       placeholder="예: 440, 101, B101" autocomplete="off" oninput="onIncRoomSearch(this.value)">
                <datalist id="mRoomsDatalist"></datalist>
                <input type="hidden" id="m_roomId" value="">
                <div id="m_roomChips" style="margin-top:6px"></div>
                <div id="m_roomPicked" style="font-size:.78rem;color:#0d9488;font-weight:600;margin-top:4px"></div>
            </div>

            <div id="incCommonBox" style="display:none">
                <div class="form-group">
                    <label>건물 선택</label>
                    <select id="m_buildingId" class="form-control"><option value="">— 건물 선택 —</option></select>
                </div>
                <div class="form-group">
                    <label>공용 구역명</label>
                    <input type="text" id="m_commonArea" class="form-control" placeholder="예: 1층 복도, 공동화장실" list="incAreaList">
                    <datalist id="incAreaList">
                        <option value="공용 전체"><option value="1층 복도"><option value="공동화장실"><option value="계단·엘리베이터"><option value="주차장"><option value="옥상·외부"></datalist>
                </div>
            </div>
            <div class="form-group">
                <label>사고 유형 분류</label>
                <select id="m_category" class="form-control">
                    <option value="시설파손" selected>시설파손</option>
                    <option value="무단점유">무단점유</option>
                    <option value="일반유지보수">일반유지보수</option>
                </select>
            </div>
            <div class="row-grid">
                <div class="form-group">
                    <label>최초 신고 일자</label>
                    <input type="text" inputmode="numeric" id="m_reportDate" class="form-control date8" placeholder="YYYYMMDD (예: 20260320)" maxlength="8" required>
                </div>
                <div class="form-group">
                    <label>보수 완료 일자 (예정일)</label>
                    <input type="text" inputmode="numeric" id="m_completeDate" class="form-control date8" placeholder="YYYYMMDD (예: 20260320)" maxlength="8">
                </div>
            </div>
            <div class="form-group">
                <label>상세 내용 기술</label>
                <input type="text" id="m_detail" class="form-control" placeholder="발생 위치 및 현황 요약 구체적 기재 필수" required>
            </div>
            <div class="form-group">
                <label>현장 증빙 사진 첨부 (USB 자동 저장)</label>
                <div class="file-upload-box" onclick="document.getElementById('photoUpload').click()">
                    <span style="font-size: 0.8rem; color: var(--text-muted);">📸 클릭하여 파손 부위 이미지 파일 업로드</span>
                    <input type="file" id="photoUpload" style="display:none;" accept="image/*" multiple onchange="previewImagesModule(this)">
                </div>
                <div class="file-preview-area" id="previewArea"></div>
            </div>
            <div class="form-group">
                <label>담당 직원 성명</label>
                <input type="text" id="m_staffName" class="form-control" placeholder="실무 담당자 이름 입력" required>
            </div>
            <div class="form-group">
                <label>추산 수리비 (만원)</label>
                <input type="number" id="m_costMan" class="form-control" placeholder="예: 320 (=3,200,000원)" min="0">
            </div>
            <input type="hidden" id="m_editId" value="">
            <div id="m_editBanner" style="display:none;background:#fff3cd;border:1px solid #ffe08a;border-left:4px solid #f0ad4e;border-radius:5px;padding:8px 10px;margin-bottom:8px;font-size:.8rem;color:#664d03"></div>
            <div class="btn-box">
                <button type="submit" class="btn btn-main" id="m_submitBtn">신규 파손신고등록</button>
                <button type="button" class="btn btn-sub" onclick="resetFormModule()">새로 입력</button>
            </div>
        </form>
    </div>

    <div class="right-panel">
        <div class="right-top">
            <div class="search-bar">
                <input type="text" id="searchKw" class="form-control" placeholder="건물명, 호실, 파손내용 등 통합 검색..." onkeyup="filterListModule()">
                <button type="button" class="btn btn-main" style="flex:none; width:80px;" onclick="filterListModule()">검색</button>
            </div>
            <div class="excel-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th class="th-no">No.</th>
                            <th>대상 호실</th>
                            <th>연락처(임차인)</th>
                            <th>사고분류</th>
                            <th>신고 일자</th>
                            <th>보수 일자</th>
                            <th>상세 내용</th>
                            <th>담당 직원</th>
                            <th>추산 수리비 (원)</th>
                            <th>처리상태</th>
                            <th style="width:70px">관리</th>
                        </tr>
                    </thead>
                    <tbody id="maintenanceTbody">
                        <tr>
                            <td colspan="11" class="cell-text-center">데이터를 불러오는 중입니다...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="right-bottom">
            <div class="viewer-header">🔍 해당 호실 유지보수 이력 및 임차인청구 가능 여부 검증용 원본 연결고리 뷰어</div>
            <div class="viewer-body">
                <div class="detail-card" id="detailCard">
                    <h4>목록에서 항목을 선택하면 상세 정보가 표시됩니다.</h4>
                </div>
            </div>
        </div>
    </div>

<script src="date8.js"></script>
<script>
var ALL_ROOMS = [];
var ALL_CONTRACTS = [];
var ALL_MAINTENANCE_LIST = [];
var SELECTED_FILES = [];

// 계약 목록 로드 (임차인명/전화번호 취득용)
async function loadContractsModule() {
    try {
        var res = await fetch('/api/v1/contracts');
        ALL_CONTRACTS = await res.json() || [];
    } catch(e) { console.error('[계약 로드 실패]', e); }
}

// room_id → 빌딩명+호실 / 임차인명 / 전화번호 매핑
function getEnrich(item) {
    // 공용부 건은 건물+구역명으로 표시
    if (item.scope === 'common') {
        var b = (ALL_ROOMS.find(function(r){ return r.building_id == item.building_id; }) || {}).building_name || '';
        return { roomStr: '🏢 ' + (b ? b + ' ' : '') + (item.common_area || '공용'), tenantName: '', tenantPhone: '' };
    }
    var rm = ALL_ROOMS.find(function(r){ return r.id == item.room_id; });
    var roomStr = rm ? ((rm.building_name || '') + ' ' + (rm.room || rm.room_no || '')).trim() : ('호실 ID:' + item.room_id);
    var ct = ALL_CONTRACTS.find(function(c){ return c.room_id == item.room_id; });
    return {
        roomStr: roomStr || ('호실 ID:' + item.room_id),
        roomNo: rm ? String(rm.room || rm.room_no || '') : '',   // 서류 창 열기용
        tenantName: ct ? (ct.tenant_name || '') : '',
        tenantPhone: ct ? (ct.tenant_phone || '') : ''
    };
}

function trunc10(num) {
    var val = Math.floor(Number(num) || 0);
    return Math.floor(val / 10) * 10;
}

// 🌟 호실 목록 조회 후 <select> 드롭다운 바인딩 (rooms.id INTEGER FK 취득)
async function loadRoomsModule() {
    try {
        var res = await fetch('/api/v1/rooms');
        ALL_ROOMS = await res.json() || [];
        var dl = document.getElementById('mRoomsDatalist');
        dl.innerHTML = '';
        ALL_ROOMS.forEach(function(rm) {
            if (!rm.id) return;
            var o = document.createElement('option');
            o.value = String(rm.room || rm.room_no || '');
            o.label = ((rm.building_name || '') + ' ' + o.value).trim();
            dl.appendChild(o);
        });
    } catch(e) { console.error('[호실 로드 실패]', e); }
}

// 호실번호에서 층 추정 (뒤 2자리=호 / B는 지하)
function guessFloor(q) {
    q = String(q || '').trim();
    if (!q) return null;
    if (/^[bB지]/.test(q)) { var bd = (q.match(/\d+/) || [''])[0]; return bd ? -parseInt(bd.slice(0,1),10) : null; }
    var d = q.replace(/\D/g, '');
    if (!d) return null;
    return d.length >= 3 ? parseInt(d.slice(0,-2),10) : parseInt(d,10);
}
function floorLabelOf(f){ return f < 0 ? ('지하'+Math.abs(f)+'층') : (f+'층'); }

// 같은 층 호실 버튼 표시
function renderIncChips(q) {
    var box = document.getElementById('m_roomChips');
    var fl = guessFloor(q);
    if (fl === null || isNaN(fl)) { box.innerHTML=''; return; }
    var list = ALL_ROOMS.filter(function(r){
        var f = (r.floor != null ? r.floor : r.floor_no); return String(f) === String(fl);
    });
    if (!list.length) { box.innerHTML=''; return; }
    var cur = String(q||'').trim();
    box.innerHTML = '<div style="font-size:.76rem;color:#495057;font-weight:600;margin-bottom:4px">'
        + floorLabelOf(fl) + ' 호실 ' + list.length + '개 — 누르면 선택</div>'
        + list.map(function(r){
            var no = String(r.room || r.room_no || ''); var on = (no === cur);
            return '<button type="button" onclick="pickIncRoom(\''+no+'\')" style="margin:0 4px 4px 0;padding:4px 10px;'
                 + 'font-size:.82rem;font-weight:700;cursor:pointer;border:1px solid '+(on?'#e83e8c':'#bbc4cc')+';border-radius:5px;'
                 + 'background:'+(on?'#e83e8c':'#fff')+';color:'+(on?'#fff':'#333')+'">'+no+'</button>';
        }).join('');
}

function pickIncRoom(no) {
    document.getElementById('m_roomSearch').value = no;
    onIncRoomSearch(no);
}

// 입력/선택 시 호실 확정
function onIncRoomSearch(q) {
    renderIncChips(q);
    var t = String(q||'').trim();
    var hit = ALL_ROOMS.find(function(r){ return String(r.room || r.room_no || '') === t; });
    document.getElementById('m_roomId').value = hit ? hit.id : '';
    document.getElementById('m_roomPicked').textContent =
        hit ? ('✔ 선택됨: ' + (hit.building_name||'') + ' ' + (hit.room||hit.room_no) + '호') : '';
}

// 백엔드 /api/v1/incidents 조회
async function loadMaintenanceModule() {
    try {
        var res = await fetch('/api/v1/incidents');
        ALL_MAINTENANCE_LIST = await res.json() || [];
        renderMaintenanceTable(ALL_MAINTENANCE_LIST);
    } catch(e) {
        console.error('[incidents 로드 실패]', e);
    }
}

function renderMaintenanceTable(list) {
    var tbody = document.getElementById('maintenanceTbody');
    tbody.innerHTML = '';

    if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11" class="cell-text-center">등록된 파손/유지보수 내역이 없습니다.</td></tr>';
        return;
    }

    list.forEach(function(item, idx) {
        var tr = document.createElement('tr');
        tr.title = '클릭하면 왼쪽에서 수정할 수 있습니다';
        tr.onclick = function() { showDetailModule(item); selectIncidentToForm(item, tr); };

        var badgeClass = item.status === '완료' ? 'status-done' : 'status-process';
        var e = getEnrich(item);
        var phoneCell = e.tenantPhone
            ? `${e.tenantName ? e.tenantName + '<br>' : ''}<a href="tel:${e.tenantPhone}">${e.tenantPhone}</a>`
            : '-';

        tr.innerHTML = `
            <td class="col-no">${idx + 1}</td>
            <td class="cell-text-center"${e.roomNo ? ` data-doc-room="${e.roomNo}" title="누르면 계약서·신분증이 새 창으로 열립니다"` : ''}>${e.roomStr}${e.roomNo ? ' 📄' : ''}</td>
            <td class="cell-text-center">${phoneCell}</td>
            <td class="cell-text-center">${item.category || '-'}</td>
            <td class="cell-num-right">${item.reported_at || '-'}</td>
            <td class="cell-num-right">${item.completed_at || '-'}</td>
            <td class="cell-text-center">${item.description || '-'}</td>
            <td class="cell-text-center">${item.reported_by_name || '-'}</td>
            <td class="cell-num-right">${trunc10(item.estimated_cost).toLocaleString()}원</td>
            <td class="cell-text-center"><span class="status-badge ${badgeClass}">${item.status || '접수중'}</span></td>
            <td class="cell-text-center"><button type="button" style="background:#fd7e14;color:#fff;border:none;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:.75rem;font-weight:700">✏️ 수정</button></td>
        `;
        tbody.appendChild(tr);
    });
}

function previewImagesModule(input) {
    var previewArea = document.getElementById('previewArea');
    previewArea.innerHTML = '';
    SELECTED_FILES = Array.from(input.files || []);

    SELECTED_FILES.forEach(function(file) {
        var reader = new FileReader();
        reader.onload = function(e) {
            var img = document.createElement('img');
            img.src = e.target.result;
            img.className = 'preview-img';
            previewArea.appendChild(img);
        };
        reader.readAsDataURL(file);
    });
}

// USB uploads/ 실제 파일 업로드 처리
async function uploadPhotosModule() {
    var uploadedPaths = [];
    for (var i = 0; i < SELECTED_FILES.length; i++) {
        var f = SELECTED_FILES[i];
        try {
            var res = await fetch('/api/v1/upload', {
                method: 'POST',
                headers: { 'X-File-Name': encodeURIComponent(f.name) },
                body: f
            });
            var data = await res.json();
            if (data.filepath) uploadedPaths.push(data.filepath);
        } catch(e) {
            console.error('사진 업로드 실패:', e);
        }
    }
    return uploadedPaths;
}

// 🌟 사진 업로드 후 /api/v1/incidents POST 호출 연결
// 대상 구분 전환 (호실 ↔ 공용부)
async function onIncScopeChange() {
    var isCommon = document.querySelector('input[name="incScope"]:checked').value === 'common';
    document.getElementById('incRoomBox').style.display = isCommon ? 'none' : '';
    document.getElementById('incCommonBox').style.display = isCommon ? '' : 'none';
    if (isCommon) {
        var sel = document.getElementById('m_buildingId');
        if (sel.options.length <= 1) {
            try {
                var res = await fetch('/api/v1/buildings');
                var list = await res.json() || [];
                list.forEach(function(b){
                    var o=document.createElement('option'); o.value=b.id; o.textContent=b.name||('건물 '+b.id); sel.appendChild(o);
                });
            } catch(e){ console.error('건물 로드 실패', e); }
        }
    }
}

async function submitMaintenanceModule() {
    var isCommon = document.querySelector('input[name="incScope"]:checked').value === 'common';
    var roomIdVal = parseInt(document.getElementById('m_roomId').value, 10) || 0;
    var buildingIdVal = 0, commonAreaVal = '';
    if (isCommon) {
        buildingIdVal = parseInt(document.getElementById('m_buildingId').value, 10) || 0;
        commonAreaVal = document.getElementById('m_commonArea').value.trim() || '공용 전체';
        if (!buildingIdVal) return alert('❌ 공용부는 건물을 선택하세요.');
    } else {
        if (!roomIdVal) return alert('❌ 호실을 선택하세요.');
    }

    var detail = document.getElementById('m_detail').value.trim();
    var staff = document.getElementById('m_staffName').value.trim();
    var reportDate = document.getElementById('m_reportDate').value;
    
    if (!detail || !staff || !reportDate) {
        return alert('❌ 필수 항목(신고일자, 상세내용, 담당자)을 입력하세요.');
    }

    var costMan = parseInt(document.getElementById('m_costMan').value, 10) || 0;
    var costWon = trunc10(costMan * 10000); // 10원 단위 절사 적용

    // 1. USB uploads/ 사진 업로드
    var savedPhotos = await uploadPhotosModule();

    // 2. 백엔드 /api/v1/incidents POST 전송
    var editId = document.getElementById('m_editId').value;
    var payload = {
        room_id: roomIdVal,
        scope: isCommon ? 'common' : 'room',
        building_id: buildingIdVal,
        common_area: commonAreaVal,
        category: document.getElementById('m_category').value,
        reported_at: reportDate,
        completed_at: document.getElementById('m_completeDate').value || '',
        description: detail,
        reported_by_name: staff,
        estimated_cost: costWon,
        status: '접수중',
        photos_json: JSON.stringify(savedPhotos) // 🌟 바이너리 저장 후 수신된 상대경로 넘김
    };
    if (editId) {
        payload.id = parseInt(editId, 10);
        if (!savedPhotos.length) delete payload.photos_json;   // 새 사진 없으면 기존 사진 유지
    }

    try {
        var res = await fetch('/api/v1/incidents', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        var resJson = await res.json();
        if (res.ok && resJson.id) {
            alert(editId ? '✏️ 수정되었습니다. (신고 ID: ' + resJson.id + ')'
                         : '✅ DB 등록 및 사진 저장 성공! (신고 ID: ' + resJson.id + ')');
            resetFormModule();
            loadMaintenanceModule();
        } else {
            alert('❌ 등록 실패: ' + (resJson.error || JSON.stringify(resJson)));
        }
    } catch(e) {
        alert('❌ 통신 오류: ' + e.message);
    }
}

function showDetailModule(item) {
    var e = getEnrich(item);
    var phoneLine = e.tenantPhone
        ? `${e.tenantName || '임차인'} / <a href="tel:${e.tenantPhone}">${e.tenantPhone}</a>`
        : '등록된 임차인 연락처 없음';
    var html = `
        <h4>[${e.roomStr}] 파손신고 연계정보</h4>
        <p><b>[임차인 연락처]</b>: ${phoneLine}</p>
        <p><b>[일자 대조 확인]</b>: 최초 접수일 = ${item.reported_at || '-'} / 완료일 = ${item.completed_at || '미정'}</p>
        <p><b>[담당자 / 사고분류]</b>: ${item.reported_by_name || '-'} / ${item.category || '-'}</p>
        <p><b>[상세 내용]</b>: ${item.description || '-'}</p>
        <p><b>[추산수리비 정산기준]</b>: ${trunc10(item.estimated_cost).toLocaleString()}원 (10원 절사 적용)</p>
    `;
    document.getElementById('detailCard').innerHTML = html;
}

function filterListModule() {
    var kw = document.getElementById('searchKw').value.toLowerCase().trim();
    var filtered = ALL_MAINTENANCE_LIST.filter(function(item) {
        var e = getEnrich(item);
        var str = (e.roomStr + ' ' + e.tenantName + ' ' + e.tenantPhone + ' ' + (item.description||'') + ' ' + (item.reported_by_name||'') + ' ' + (item.category||'')).toLowerCase();
        return !kw || str.includes(kw);
    });
    renderMaintenanceTable(filtered);
}

function resetFormModule() {
    document.getElementById('maintenanceForm').reset();
    document.getElementById('previewArea').innerHTML = '';
    SELECTED_FILES = [];
    document.getElementById('m_editId').value = '';
    document.getElementById('m_editBanner').style.display = 'none';
    document.getElementById('m_submitBtn').textContent = '신규 파손신고등록';
    document.getElementById('m_submitBtn').style.background = '';
    document.getElementById('m_roomId').value = '';
    document.getElementById('m_roomChips').innerHTML = '';
    document.getElementById('m_roomPicked').textContent = '';
    document.querySelectorAll('#maintenanceTbody tr').forEach(function(r){ r.style.background=''; });
}

// 목록 클릭 → 좌측 폼에 채워 수정 모드로
function selectIncidentToForm(item, tr) {
    document.querySelectorAll('#maintenanceTbody tr').forEach(function(r){ r.style.background=''; });
    if (tr) tr.style.background = '#fff3cd';

    document.getElementById('m_editId').value = item.id;
    var isCommon = (item.scope === 'common');
    document.querySelector('input[name="incScope"][value="' + (isCommon?'common':'room') + '"]').checked = true;
    onIncScopeChange();

    if (isCommon) {
        setTimeout(function(){
            var s=document.getElementById('m_buildingId'); if(s) s.value = item.building_id || '';
        }, 250);
        document.getElementById('m_commonArea').value = item.common_area || '';
    } else {
        var rm = ALL_ROOMS.find(function(r){ return r.id == item.room_id; });
        var no = rm ? String(rm.room || rm.room_no || '') : '';
        document.getElementById('m_roomSearch').value = no;
        onIncRoomSearch(no);
    }

    document.getElementById('m_category').value = item.category || '시설파손';
    document.getElementById('m_reportDate').value = (item.reported_at || '').substring(0,10);
    document.getElementById('m_completeDate').value = (item.completed_at || '').substring(0,10);
    document.getElementById('m_detail').value = item.description || '';
    document.getElementById('m_staffName').value = item.reported_by_name || '';
    document.getElementById('m_costMan').value = item.estimated_cost ? Math.floor(item.estimated_cost/10000) : '';

    var b = document.getElementById('m_editBanner');
    b.style.display = '';
    b.innerHTML = '✏️ <b>' + (item.category||'') + '</b> 신고건 수정 중 — 고친 뒤 <b>[수정 내용 저장]</b>을 누르세요.';
    document.getElementById('m_submitBtn').textContent = '✏️ 수정 내용 저장';
    document.getElementById('m_submitBtn').style.background = '#fd7e14';
}

// 숫자 연속 입력 시 YYYY-MM-DD 포맷 자동 변환 함수
function autoFormatDate(input) {
    let val = input.value.replace(/\D/g, '');
    if (val.length >= 8) {
        input.value = val.substring(0, 4) + '-' + val.substring(4, 6) + '-' + val.substring(6, 8);
    } else if (val.length >= 6) {
        input.value = val.substring(0, 4) + '-' + val.substring(4, 6) + '-' + val.substring(6);
    } else if (val.length >= 4) {
        input.value = val.substring(0, 4) + '-' + val.substring(4);
    } else {
        input.value = val;
    }
}

    document.getElementById('m_reportDate').value = new Date().toISOString().split('T')[0];
    await loadRoomsModule();
    await loadContractsModule();
    loadMaintenanceModule();
});
