<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>계약서 관리 시스템 (임대인 전용)</title>
    <style>
        :root { 
            --primary: #fd7e14; 
            --secondary: #17a2b8; 
            --border: #dee2e6; 
            --bg: #f8f9fa; 
            --text-dark: #495057;
            --text-muted: #6c757d;
            --success: #28a745;
            --danger: #dc3545;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, input, select, textarea, button { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; 
        }
        
        body { display: flex; height: 100vh; overflow: hidden; background-color: var(--bg); }

        .left-form-panel { 
            width: 35%; 
            background: var(--white); 
            border-right: 1px solid var(--border); 
            padding: 16px; 
            overflow-y: auto; 
            scrollbar-width: thin; 
        }
        .right-viewer-panel { 
            width: 65%; 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            background: var(--white); 
        }

        .section-sep { border: 0; border-top: 1px dashed var(--border); margin: 14px 0; }

        .panel-title { 
            font-size: 0.95rem; 
            color: var(--primary); 
            margin: 14px 0 8px; 
            padding-bottom: 5px; 
            border-bottom: 2px solid var(--primary); 
            font-weight: bold; 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-title:first-child { margin-top: 0; }
        .panel-title-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: normal;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 10px;
            align-items: flex-start;
        }

        .form-group { 
            display: flex; 
            flex-direction: column;
            gap: 5px;
        }
        .form-group>label { 
            font-size: 0.78rem; 
            font-weight: 600; 
            color: var(--text-dark); 
        }
        .form-control { 
            width: 100%; 
            padding: 7px 10px; 
            border: 1px solid var(--border); 
            border-radius: 4px; 
            font-size: 0.82rem; 
            box-sizing: border-box; 
            line-height: 1.4;
        }
        .form-control:focus {
            border-color: var(--primary);
            outline: none;
        }

        .flex-box { display: flex; gap: 4px; width: 100%; }

        .btn-box { margin-top: 18px; display: flex; gap: 6px; align-items: center; }
        .btn { padding: 10px 12px; border: none; border-radius: 4px; font-size: 0.85rem; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-main   { background: var(--primary); color: var(--white); flex: 3; }
        .btn-sub    { background: var(--text-muted); color: var(--white); flex: 1; font-size: 0.8rem; padding: 10px 6px; }
        .btn-sec    { background: var(--secondary); color: var(--white); padding: 4px 10px; font-size: 0.75rem; white-space: nowrap; border-radius: 4px; }

        .doc-card { border: 1px solid var(--border); border-radius: 4px; padding: 10px; background: var(--bg); }
        .doc-card-title { font-weight: 600; font-size: 0.8rem; color: #333; margin-bottom: 6px; }

        .viewer-top-special-frame {
            padding: 12px 14px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .viewer-memo-label { font-size: 0.85rem; font-weight: bold; color: var(--primary); }
        textarea.viewer-memo-textarea { 
            width: 100%; 
            height: 4.5rem; 
            padding: 8px 12px; 
            border: 1px solid var(--border); 
            border-radius: 4px; 
            font-size: 0.85rem; 
            outline: none; 
            resize: none;
            line-height: 1.5;
        }
        textarea.viewer-memo-textarea:focus { border-color: var(--primary); }

        .viewer-header-mid { 
            background: #f1f3f5; 
            padding: 8px 14px; 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .viewer-header-mid h3 { font-size: 0.85rem; margin: 0; color: #333; }
        .viewer-badge  { font-size: 0.72rem; padding: 2px 8px; border-radius: 3px; background: #e9ecef; color: #495057; }
        
        .viewer-body-bottom { flex: 1; background: #525659; display: flex; justify-content: center; align-items: center; overflow: auto; position: relative; }
        .placeholder    { color: #aaa; font-size: 0.82rem; text-align: center; line-height: 1.6; }
        .viewer-img     { max-width: 100%; max-height: 100%; object-fit: contain; }
        .viewer-iframe  { width: 100%; height: 100%; border: none; background: #fff; }
    </style>
</head>
<body>

    <div class="left-form-panel">
        <form id="contractForm" onsubmit="event.preventDefault();">
            
            <div class="panel-title">💰 상세 계약 내용</div>
            
            <div class="grid-2col">
                <div class="form-group">
                    <label>호실 선택</label>
                    <select id="f_roomId" class="form-control" required onchange="onRoomSelect()">
                        <option value="">— 호실 선택 —</option>
                    </select>
                    <!-- 순수 원본 룸넘버 보관용 hidden 필드 -->
                    <input type="hidden" id="f_selectedRoomInfo" value="">
                </div>
                <div class="form-group">
                    <label>계약 구분 종류</label>
                    <select id="f_leaseType" class="form-control">
                        <option value="월세" selected>월세</option>
                        <option value="전세">전세</option>
                        <option value="반전세">반전세</option>
                    </select>
                </div>
            </div>

            <div class="grid-2col">
                <div class="form-group">
                    <label>보증금 금액 (원)</label>
                    <input type="number" id="f_deposit" class="form-control" value="0" min="0">
                </div>
                <div class="form-group">
                    <label>월세 임대료 (원)</label>
                    <input type="number" id="f_monthlyRent" class="form-control" value="0" min="0">
                </div>
            </div>

            <div class="grid-2col">
                <div class="form-group">
                    <label>관리비 금액 (원)</label>
                    <input type="number" id="f_maintenanceFee" class="form-control" value="0" min="0">
                </div>
                <div class="form-group">
                    <label>계약 시작일</label>
                    <input type="date" id="f_startDate" class="form-control" required />
                </div>
            </div>

            <div class="grid-2col">
                <div class="form-group">
                    <label>계약 종료일</label>
                    <input type="date" id="f_endDate" class="form-control" required />
                </div>
            </div>
            
            <hr class="section-sep" />
            
            <div class="panel-title">👤 계약 상대방 정보</div>
            
            <div class="grid-2col">
                <div class="form-group">
                    <label>이름 / 상호</label>
                    <input type="text" id="f_tenantName" class="form-control" required placeholder="상호 및 성명 기입">
                </div>
                <div class="form-group">
                    <label>휴대폰 번호</label>
                    <input type="tel" id="f_tenantPhone" class="form-control" maxlength="14" required placeholder="010-1234-5678" oninput="fmtPhone(this)" />
                </div>
            </div>

            <div class="grid-2col">
                <div class="form-group">
                    <label>대표자 실명</label>
                    <input type="text" id="f_tenantRep" class="form-control" required placeholder="홍길동">
                </div>
                <div class="form-group">
                    <label>이메일 주소</label>
                    <input type="email" id="f_tenantEmail" class="form-control" placeholder="name@company.com" oninput="this.value=this.value.toLowerCase()" />
                </div>
            </div>

            <hr class="section-sep">
            
            <div class="panel-title">
                🤝 중개사 검색 및 정산 
                <span class="panel-title-sub">(공란 가능)</span>
            </div>
            <div class="grid-2col">
                <div class="form-group">
                    <label>중개사 검색</label>
                    <div class="flex-box">
                        <input type="text" id="f_brokerSearch" class="form-control" placeholder="명부에 등록된 상호명 입력">
                        <button type="button" class="btn btn-sec" onclick="searchBroker()">검색</button>
                    </div>
                    <input type="hidden" id="f_brokerId" value="0">
                </div>
                <div class="form-group">
                    <label>중개 수수료 (원)</label>
                    <input type="number" id="f_commissionFee" class="form-control" value="0" min="0">
                </div>
            </div>

            <hr class="section-sep">
            
            <div class="panel-title">📄 증빙 서류 마스터 통합 업로드</div>
            <div class="grid-2col">
                <div class="doc-card">
                    <div class="doc-card-title">주민등록증 앞면 사본</div>
                    <input type="file" id="f_idFront" class="form-control" accept=".png,.jpg,.jpeg,.pdf,image/png,image/jpeg,application/pdf" onchange="onIdUpload(this)">
                </div>
                <div class="doc-card">
                    <div class="doc-card-title">임대차 계약서 원본 스캔 파일</div>
                    <input type="file" id="f_contractFile" class="form-control" accept=".png,.jpg,.jpeg,.pdf,image/png,image/jpeg,application/pdf" onchange="onContractUpload(this)">
                </div>
            </div>

            <div class="btn-box">
                <button type="button" class="btn btn-main" onclick="saveContract()">💾 계약 데이터 마스터 저장</button>
                <button type="button" class="btn btn-sub" onclick="resetAll()">초기화</button>
            </div>
        </form>
    </div>

    <div class="right-viewer-panel">
        
        <div class="viewer-top-special-frame">
            <span class="viewer-memo-label">✍️ 특약사항</span>
            <textarea id="f_specialTerms" class="viewer-memo-textarea" placeholder="계약 관련 특약 사항 내용을 입력하세요."></textarea>
        </div>

        <div class="viewer-header-mid">
            <h3>📄 사본확인</h3>
            <span class="viewer-badge" id="vBadge">미선택 상태</span>
        </div>
        
        <div class="viewer-body-bottom" id="viewerArea">
            <div class="placeholder" id="viewerPh">신분증 사본 혹은 임대차 계약서 파일을 왼쪽에서 첨부하면<br>고해상도 실시간 렌더링 검침이 통합 시작됩니다.</div>
        </div>
    </div>

<script>
var _idPath = null, _ctrPath = null;

function fmtPhone(el) {
    var v = el.value.replace(/[^0-9]/g,'');
    if(v.length > 3 && v.length <= 7) el.value = v.substr(0,3) + '-' + v.substr(3);
    else if(v.length > 7) el.value = v.substr(0,3) + '-' + v.substr(3,4) + '-' + v.substr(7,4);
    else el.value = v;
}

function onIdUpload(inp){
    var f = inp.files[0];
    if(!f) return;
    _idPath = f.name;
    showViewer(f, '신분증');
}

function onContractUpload(inp){
    var f = inp.files[0];
    if(!f) return;
    _ctrPath = f.name;
    showViewer(f, '계약서');
}

function showViewer(file, src){
    var r = new FileReader(), ext = file.name.split('.').pop().toLowerCase();
    r.onload = function(e){
        var a = document.getElementById('viewerArea'), b = document.getElementById('vBadge');
        a.innerHTML = '';
        b.textContent = src === '신분증' ? '📄 신분증 검증 채널' : '📎 계약서 원본 채널';
        
        if(ext === 'pdf'){
            a.innerHTML = '<iframe src="' + e.target.result + '" class="viewer-iframe"></iframe>';
        } else if(['jpg','jpeg','png'].indexOf(ext) >= 0){
            a.innerHTML = '<img src="' + e.target.result + '" class="viewer-img">';
        }
    };
    r.readAsDataURL(file);
}

// === rooms API 연동 ===
var ALL_ROOMS = [];

async function loadRooms(){
    try {
        var res = await fetch('/api/v1/rooms');
        ALL_ROOMS = await res.json() || [];
        
        var sel = document.getElementById('f_roomId');
        sel.innerHTML = '<option value="">— 호실 선택 —</option>';
        
        for (var i = 0, len = ALL_ROOMS.length; i < len; i++){
            var rm = ALL_ROOMS[i];
            if (!rm.id) continue;
            
            var opt = document.createElement('option');
            opt.value = rm.id; // rooms.id (PK)
            
            var roomNoStr = rm.room || rm.room_no || '';
            var buildingNameStr = rm.building_name || '';
            opt.textContent = (buildingNameStr + ' ' + roomNoStr).trim();
            sel.appendChild(opt);
        }
    } catch(e) {
        console.warn('[rooms load 실패]', e);
    }
}

// 호실 선택 시: API에서 전달된 원본 room_no 값을 가공 없이 그대로 세팅
function onRoomSelect(){
    var selVal = document.getElementById('f_roomId').value;
    var idx = parseInt(selVal, 10);
    
    if (!idx) {
        document.getElementById('f_selectedRoomInfo').value = '';
        return;
    }

    var rm = ALL_ROOMS.find(function(r){ return r.id == idx; });
    if (rm) {
        document.getElementById('f_selectedRoomInfo').value = (rm.room || rm.room_no || '').toString();
    }
}

document.addEventListener('DOMContentLoaded', function(){
    loadRooms();
});

function searchBroker(){
    var kw = document.getElementById('f_brokerSearch').value.trim();
    if(!kw){
        alert('⚠️ 검색할 중개사 상호명/법인명을 입력하세요.');
        return;
    }

    var partnerTable = document.getElementById('partnerTable') || (window.opener ? window.opener.document.getElementById('partnerTable') : null);
    
    if(!partnerTable) {
        if(kw.indexOf('팩토리') >= 0 || kw.indexOf('대박') >= 0){
            document.getElementById('f_brokerId').value = '1';
            alert('✅ [임시 매핑] 협력사 명부에서 "' + kw + '" 명칭을 발견하여 연동했습니다. (contacts.id=1)');
        } else {
            document.getElementById('f_brokerId').value = '0';
            alert('❌ 현재 화면 내에서 협력사 명부 데이터베이스 구조(#partnerTable)를 찾을 수 없습니다.');
        }
        return;
    }

    var rows = partnerTable.querySelectorAll('tbody tr');
    var found = false;

    for(var i = 0; i < rows.length; i++) {
        var compTd = rows[i].querySelector('.td-company');
        if(compTd && compTd.innerText.toLowerCase().includes(kw.toLowerCase())) {
            var id = rows[i].cells[0].innerText;
            document.getElementById('f_brokerId').value = id;
            document.getElementById('f_brokerSearch').value = compTd.innerText;
            
            rows.forEach(r => r.classList.remove('selected'));
            rows[i].classList.add('selected');

            alert('✅ 중개사 명부 연동 완료\n\n상호명: ' + compTd.innerText + '\n고유 식별번호(PK): ' + id);
            found = true;
            break;
        }
    }

    if(!found) {
        document.getElementById('f_brokerId').value = '0';
        alert('❌ 협력사 인적 데이터 명부에서 "' + kw + '" 와(과) 일치하는 상호명을 찾을 수 없습니다.\n직접거래 시 공란으로 진행 가능합니다.');
    }
}

async function saveContract(){
    var roomIdVal = parseInt(document.getElementById('f_roomId').value, 10);
    if (!roomIdVal) {
        alert('❌ 호실을 선택해 주세요.');
        document.getElementById('f_roomId').focus();
        return;
    }

    var startDate = document.getElementById('f_startDate').value;
    var endDate = document.getElementById('f_endDate').value;
    if (!startDate || !endDate) {
        alert('❌ 계약 일정 시작일 및 종료일자는 필수 기입 데이터입니다.');
        return;
    }

    var deposit = parseInt(document.getElementById('f_deposit').value, 10) || 0;
    var monthly = parseInt(document.getElementById('f_monthlyRent').value, 10) || 0;
    if (deposit + monthly <= 0) {
        alert('❌ 보증금 재원 혹은 월세 임대료 중 하나는 반드시 입력되어야 합니다.');
        return;
    }

    // 1. 임차인 정보 contacts 테이블에 먼저 INSERT하여 FK(id) 취득
    var tenantName = document.getElementById('f_tenantName').value.trim();
    var tenantPhone = document.getElementById('f_tenantPhone').value.trim();
    var tenantRep = document.getElementById('f_tenantRep').value.trim();
    var tenantEmail = document.getElementById('f_tenantEmail').value.trim();

    var tenantContactId = 0;
    if (tenantName) {
        try {
            var cRes = await fetch('/api/v1/contacts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    category: 'tenant',
                    company_or_name: tenantName,
                    representative_name: tenantRep || tenantName,
                    contact_info: tenantPhone || '010-0000-0000',
                    email: tenantEmail
                })
            });
            var cData = await cRes.json();
            if (cData.id) {
                tenantContactId = cData.id;
            }
        } catch(e) {
            console.warn('[contacts 연동 실패]', e);
        }
    }

    // 2. 호실 및 주소 정보 수집 (가공 없는 원본 결합)
    var selectedRoom = ALL_ROOMS.find(function(r){ return r.id == roomIdVal; }) || {};
    
    // 순수 원본 room_no
    var roomNoVal = document.getElementById('f_selectedRoomInfo').value.trim();
    if (!roomNoVal && selectedRoom) {
        roomNoVal = (selectedRoom.room || selectedRoom.room_no || '').toString().trim();
    }

    // [도로명 주소] + [공백 1칸] + [건물명] 정직하게 결합
    var realAddress = (selectedRoom.building_address || '').trim();
    var buildingName = (selectedRoom.building_name || '').trim();
    var fullAddress = [realAddress, buildingName].filter(Boolean).join(' ');

    var payload = {
        room_id: roomIdVal,                             // rooms.id (PK)
        room_no: roomNoVal,                             // 원본 룸넘버
        host_address_full: fullAddress,                 // 도로명 주소 + 건물명
        lease_type: document.getElementById('f_leaseType').value,
        deposit_amount: deposit,
        monthly_rent: monthly,
        maintenance_fee: parseInt(document.getElementById('f_maintenanceFee').value, 10) || 0,
        commission_fee: parseInt(document.getElementById('f_commissionFee').value, 10) || 0,
        start_date: startDate,
        end_date: endDate,
        documents_json: JSON.stringify([{type:'주민증앞면', name:_idPath || null}, {type:'계약서원본', name:_ctrPath || null}]),
        broker_id: parseInt(document.getElementById('f_brokerId').value, 10) || 0,
        tenant_contact_id: tenantContactId,             // 정수형 FK 전달
        owner_contact_id: 1,
        special_terms: document.getElementById('f_specialTerms').value.trim()
    };

    try {
        var res = await fetch('/api/v1/contracts', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
        });
        var resJson = await res.json();
        if(resJson.id){
            alert('✅ 계약서 마스터 저장 성공! (계약 ID: ' + resJson.id + ')');
        } else {
            alert('❌ 계약서 등록 실패: ' + (resJson.error || JSON.stringify(resJson)));
        }
    } catch(e) {
        alert('❌ API 통신 오류: ' + e.message);
    }
}

function resetAll(){
    document.getElementById('contractForm').reset();
    document.getElementById('f_specialTerms').value = ''; 
    ['_idPath','_ctrPath'].forEach(function(k){ window[k] = null; });
    document.getElementById('f_brokerId').value = '0';
    
    document.getElementById('viewerArea').innerHTML = '<div class="placeholder" id="viewerPh">신분증 사본 혹은 임대차 계약서 파일을 왼쪽에서 첨부하면<br>고해상도 실시간 렌더링 검침이 통합 시작됩니다.</div>';
    document.getElementById('vBadge').textContent = '미선택 상태';
}
</script>

</body>
</html>
