<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>계약서 관리 (B) - 원본 뷰어</title>
<style>
  :root{--primary:#5b21b6;--border:#dee2e6;--bg:#f8f9fa;--muted:#6c757d;--ok:#28a745;--warn:#f0ad4e;--danger:#dc3545;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI','Malgun Gothic',sans-serif;display:flex;height:100vh;overflow:hidden;background:var(--bg)}
  .left{width:35%;background:var(--white);border-right:1px solid var(--border);padding:20px;overflow-y:auto}
  .right{width:65%;display:flex;flex-direction:column;background:#525659}
  .panel-title{font-size:1.05rem;color:var(--primary);font-weight:bold;border-bottom:2px solid var(--primary);padding-bottom:8px;margin-bottom:14px}
  .upload-box{background:#f3effc;border:1px dashed #b79ce8;border-radius:8px;padding:12px;margin-bottom:14px}
  /* 업로드 2칸 좌우 배치 */
  .upload-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .upload-2col .upload-box{margin-bottom:0}
  .upload-2col .upload-box input[type=file]{font-size:.78rem;padding:6px 8px}
  /* 파일 목록·상태: 1줄 유지(넘치면 가로 스크롤) → 세로로 밀리지 않음 */
  #docFileList,#idFileList{white-space:nowrap;overflow-x:auto;max-height:2em;margin-top:5px}
  #docFileList a,#idFileList a{max-width:150px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
  #ocrStatus{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:5px 8px;margin-top:5px}
  .upload-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
  .form-group{margin-bottom:10px}
  label{display:block;font-size:.8rem;font-weight:600;color:#495057;margin-bottom:3px}
  .form-control{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;font-size:.88rem}
  textarea.form-control{min-height:90px;font-family:inherit;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  fieldset{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:12px}
  legend{font-size:.82rem;font-weight:700;color:var(--primary);padding:0 6px}
  .btn{padding:9px 14px;border:none;border-radius:5px;font-size:.85rem;font-weight:bold;cursor:pointer}
  .btn-main{background:var(--primary);color:#fff}
  .btn-ocr{background:#7c3aed;color:#fff}
  .btn-sub{background:var(--muted);color:#fff}
  .btn-save{background:var(--ok);color:#fff;width:100%;padding:12px;font-size:.95rem;margin-top:8px}
  /* OCR 추정값 강조 */
  .ocr-filled{background:#fffbe6;border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
  .badge{display:inline-block;font-size:.66rem;padding:1px 6px;border-radius:9px;margin-left:6px;vertical-align:middle}
  .b-high{background:#e6f4ea;color:#1e7e34}
  .b-medium{background:#fff3cd;color:#856404}
  .b-low{background:#fdecea;color:#a12622}
  .hint{font-size:.72rem;color:var(--muted);margin-top:2px}
  #ocrStatus{font-size:.78rem;margin-top:8px;padding:8px;border-radius:5px;display:none}
  .st-ok{background:#e6f4ea;color:#1e7e34}
  .st-warn{background:#fff8e1;color:#8a6d00}
  .st-err{background:#fdecea;color:#a12622}
  /* 특약: 우측 상단 가로 전체 (3줄 고정, 넘치면 스크롤) */
  .terms-bar{background:#2f3235;padding:8px 12px 10px;border-bottom:1px solid #1f2123}
  .terms-bar label{color:#cfd3d6;font-size:.76rem;font-weight:600;margin-bottom:4px;display:block}
  .terms-bar textarea{width:100%;height:4.6em;line-height:1.45;resize:vertical;padding:7px 9px;border:1px solid #55595c;border-radius:5px;font-family:inherit;font-size:.86rem;background:#fff;color:#222}
  .viewer-head{background:#3a3d40;color:#e0e0e0;padding:8px 14px;font-size:.8rem;display:flex;justify-content:space-between;align-items:center}
  .vbtn{background:#4a4e52;color:#dfe3e6;border:1px solid #616569;border-radius:5px;padding:4px 11px;font-size:.78rem;font-weight:700;cursor:pointer;margin-left:8px}
  .vbtn:hover{background:#5a5f63}
  .vbtn.active{background:#7c3aed;border-color:#7c3aed;color:#fff}
  #viewerNav{margin-left:10px;color:#c9ced2}
  #viewerNav button{background:#4a4e52;color:#dfe3e6;border:1px solid #616569;border-radius:4px;padding:2px 8px;font-size:.76rem;cursor:pointer;margin:0 2px}
  .viewer-body{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:10px}
  .viewer-body iframe{width:100%;height:100%;border:none;background:#fff}
  .viewer-body img{max-width:100%;max-height:100%;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .viewer-empty{color:#9aa0a6;font-size:.85rem;text-align:center;line-height:1.6}
  .review-note{background:#fff3cd;color:#856404;font-size:.74rem;padding:7px 10px;border-radius:5px;margin-bottom:12px;border:1px solid #ffe69c}
</style>
<script src="guard.js"></script>
</head>
<body>

  <div class="left">
    <div class="panel-title">📄 B. 계약서 등록 · 원본 대조 뷰어</div>

    <div class="upload-2col">
      <div class="upload-box">
        <label>📄 계약서 원본 <span style="color:var(--danger);font-weight:700">⚠️ 대조확인</span></label>
        <input type="file" id="docFile" class="form-control" multiple accept=".pdf,.jpg,.jpeg,.png,.webp" onchange="handleFilePicked()">
        <div id="docFileList" class="hint"></div>
        <div id="ocrStatus"></div>
      </div>

      <div class="upload-box" style="background:#eef7f0;border-color:#9ccfae">
        <label>🪪 신분증 사본 <span style="font-weight:400;color:var(--muted)">(필요시)</span></label>
        <input type="file" id="idFile" class="form-control" multiple accept="image/*,.pdf" onchange="handleIdPicked()">
        <div id="idFileList" class="hint"></div>
      </div>
    </div>

    <form id="contractForm" onsubmit="event.preventDefault();saveContract();">
      <fieldset>
        <legend>계약 기본</legend>
        <div class="form-group">
          <label>연동 호실 (선택)</label>
          <select id="roomId" class="form-control" onchange="onRoomChanged()"><option value="">— 호실 선택 —</option></select>
          <div class="hint" id="roomHint"></div>
        </div>
        <div class="grid2">
          <div class="form-group">
            <label>계약종류</label>
            <select id="leaseType" class="form-control">
              <option value="월세">월세</option><option value="전세">전세</option><option value="반전세">반전세</option>
            </select>
          </div>
          <div class="form-group">
            <label>소재지(주소) <span style="font-weight:400;color:var(--muted);font-size:.72rem">— 호실 선택 시 자동</span></label>
            <input type="text" id="hostAddress" class="form-control" oninput="this.dataset.auto='0'">
          </div>
        </div>
        <div class="grid3">
          <div class="form-group"><label>보증금(만원)</label><input type="number" id="deposit" class="form-control" value="0" placeholder="예: 5000 = 5,000만원" oninput="updateAmountHint()"></div>
          <div class="form-group"><label>월차임(만원)</label><input type="number" id="rent" class="form-control" value="0" placeholder="예: 350 = 350만원" oninput="updateAmountHint()"></div>
          <div class="form-group"><label>관리비(원)</label><input type="number" id="maint" class="form-control" value="0" placeholder="원 단위"></div>
        </div>
        <div class="hint" id="amountHint" style="margin:-4px 0 8px"></div>
        <div class="grid2">
          <div class="form-group"><label>계약 시작일</label><input type="text" inputmode="numeric" id="startDate" class="form-control date8" maxlength="8" placeholder="YYYYMMDD"></div>
          <div class="form-group"><label>계약 종료일</label><input type="text" inputmode="numeric" id="endDate" class="form-control date8" maxlength="8" placeholder="YYYYMMDD"></div>
        </div>
        <div class="form-group" style="background:#f3effc;border:1px solid #d6c9f0;border-radius:5px;padding:7px 10px;">
          <label style="display:flex;align-items:center;gap:7px;margin:0;cursor:pointer;font-size:.84rem;white-space:nowrap">
            <input type="checkbox" id="vatApplied" checked style="width:16px;height:16px;cursor:pointer">
            부가세 10% 적용 <span style="color:var(--muted);font-weight:400">(단기계약은 해제)</span>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>임차인</legend>
        <div class="grid3">
          <div class="form-group"><label>성명</label><input type="text" id="tenantName" class="form-control"></div>
          <div class="form-group"><label>주민번호(마스킹)</label><input type="text" id="tenantRrn" class="form-control"></div>
          <div class="form-group"><label>전화</label><input type="text" id="tenantPhone" class="form-control"></div>
        </div>
      </fieldset>

      <input type="hidden" id="editContractId" value="">
      <div id="cEditBanner" style="display:none;background:#fff3cd;border:1px solid #ffe08a;border-left:4px solid #f0ad4e;border-radius:5px;padding:8px 10px;margin-bottom:8px;font-size:.8rem;color:#664d03"></div>
      <button type="submit" class="btn btn-save" id="cSaveBtn">💾 계약서 저장 (원본문서 첨부)</button>
      <button type="button" class="btn btn-sub" style="width:100%;margin-top:6px" onclick="resetContractForm()">새 계약 입력 (선택 해제)</button>
    </form>
  </div>

  <div class="right">
    <div class="terms-bar">
      <label for="specialTerms">📝 특약사항 (가로 전체 사용 · 길게 입력 가능)</label>
      <textarea id="specialTerms" placeholder="특약 조항을 입력하세요. 여러 줄 입력 가능합니다."></textarea>
    </div>
    <div class="viewer-head">
      <span>
        📎 원본 뷰어
        <button type="button" class="vbtn active" id="vbtnDoc" onclick="switchViewer('doc')">📄 계약서</button>
        <button type="button" class="vbtn" id="vbtnId" onclick="switchViewer('id')">🪪 신분증</button>
        <span id="viewerNav"></span>
      </span>
      <span id="viewerName"></span>
    </div>
    <div class="viewer-body" id="viewer">
      <div class="viewer-empty">좌측에서 계약서 PDF나 사진을 업로드하면<br>여기에 원본이 표시됩니다.<br>원본을 보며 좌측 칸을 입력한 뒤 저장하세요.</div>
    </div>
  </div>

<script src="auth.js"></script>
<script src="date8.js"></script>
<script>
var DOC_FILES = [];    // 계약서 원본들 [{name, path}]
var ID_FILES  = [];    // 신분증 사본들 [{name, path}]
var ALL_ROOMS = [];

// 파일 여러 개 업로드 공통 처리
async function uploadMany(files, bucket, listElId, label){
  var listEl = document.getElementById(listElId);
  for (var i=0; i<files.length; i++){
    var f = files[i];
    listEl.innerHTML = label + ' 업로드 중... (' + (i+1) + '/' + files.length + ')';
    try{
      var res = await fetch('/api/v1/upload', {method:'POST', headers:{'X-File-Name':encodeURIComponent(f.name)}, body:f});
      var d = await res.json();
      if (d.filepath) bucket.push({name:f.name, path:d.filepath});
    }catch(e){ /* 개별 실패는 건너뜀 */ }
  }
  renderFileList(bucket, listElId);
  return bucket;
}

// 업로드된 파일 목록 표시 (클릭하면 우측 뷰어에 표시)
function renderFileList(bucket, listElId){
  var el = document.getElementById(listElId);
  if (!bucket.length){ el.innerHTML=''; return; }
  var mode = (listElId === 'docFileList') ? 'doc' : 'id';
  el.innerHTML = bucket.map(function(x, i){
    return '<a href="javascript:void(0)" onclick="VIEW_IDX=' + i + ';switchViewerKeepIdx(\'' + mode + '\')" '
         + 'style="display:inline-block;margin:3px 6px 0 0;padding:2px 7px;background:#fff;border:1px solid #ccc;border-radius:4px;text-decoration:none;color:#333">'
         + '📎 ' + (i+1) + '. ' + x.name + '</a>';
  }).join('');
}

function setStatus(msg, cls){
  var el=document.getElementById('ocrStatus');
  el.textContent=msg; el.className=''; el.classList.add(cls); el.style.display='block';
}

// 1) 파일 선택 → 서버 업로드 → 원본 뷰어 표시
// 계약서 원본 (여러 장)
async function handleFilePicked(){
  var fi=document.getElementById('docFile');
  if(!fi.files || !fi.files.length) return;
  setStatus('계약서 업로드 중...', 'st-warn');
  await uploadMany(fi.files, DOC_FILES, 'docFileList', '계약서');
  if (DOC_FILES.length){
    VIEW_IDX = DOC_FILES.length-1; switchViewerKeepIdx('doc');
    setStatus('✅ 계약서 ' + DOC_FILES.length + '장 저장','st-ok');
  } else {
    setStatus('업로드 실패','st-err');
  }
  fi.value='';
}

// 신분증 사본 (필요시, 여러 장)
async function handleIdPicked(){
  var fi=document.getElementById('idFile');
  if(!fi.files || !fi.files.length) return;
  await uploadMany(fi.files, ID_FILES, 'idFileList', '신분증');
  if (ID_FILES.length){
    VIEW_IDX = ID_FILES.length-1; switchViewerKeepIdx('id');
  }
  fi.value='';
}

var VIEW_MODE='doc', VIEW_IDX=0;

// 뷰어 전환 (계약서 / 신분증)
function switchViewer(mode){
  VIEW_MODE = mode; VIEW_IDX = 0;
  document.getElementById('vbtnDoc').classList.toggle('active', mode==='doc');
  document.getElementById('vbtnId').classList.toggle('active', mode==='id');
  renderCurrentView();
}

function currentBucket(){ return VIEW_MODE==='doc' ? DOC_FILES : ID_FILES; }

// 현재 모드의 파일을 뷰어에 표시 (여러 장이면 ◀ ▶ 이동)
function renderCurrentView(){
  var list = currentBucket();
  var nav = document.getElementById('viewerNav');
  if (!list.length){
    nav.innerHTML='';
    document.getElementById('viewerName').textContent='';
    document.getElementById('viewer').innerHTML =
      '<div class="viewer-empty">' + (VIEW_MODE==='doc' ? '계약서 원본을' : '신분증 사본을') + ' 업로드하면<br>여기에 표시됩니다.</div>';
    return;
  }
  if (VIEW_IDX >= list.length) VIEW_IDX = list.length-1;
  if (VIEW_IDX < 0) VIEW_IDX = 0;
  nav.innerHTML = list.length>1
    ? '<button type="button" onclick="viewStep(-1)">◀</button>' + (VIEW_IDX+1) + ' / ' + list.length + '<button type="button" onclick="viewStep(1)">▶</button>'
    : '1 / 1';
  showViewer(list[VIEW_IDX].path, list[VIEW_IDX].name);
}

function viewStep(d){ VIEW_IDX += d; renderCurrentView(); }

// 업로드 직후: 인덱스 유지한 채 모드만 전환
function switchViewerKeepIdx(mode){
  var keep = VIEW_IDX;
  VIEW_MODE = mode;
  document.getElementById('vbtnDoc').classList.toggle('active', mode==='doc');
  document.getElementById('vbtnId').classList.toggle('active', mode==='id');
  VIEW_IDX = keep;
  renderCurrentView();
}

function showViewer(path, name){
  var v=document.getElementById('viewer');
  document.getElementById('viewerName').textContent=name||'';
  var lower=(path||'').toLowerCase();
  // 파일명에 공백/한글이 있어도 열리도록 URL 인코딩 (경로 구분자 / 는 유지)
  var url = '/' + String(path||'').split('/').map(encodeURIComponent).join('/');
  if(lower.endsWith('.pdf')){
    v.innerHTML='<iframe src="'+url+'"></iframe>';
  }else{
    v.innerHTML='<img src="'+url+'" alt="원본">';
  }
}

// 만원 입력값을 원 단위로 환산해 보여줌 (입력 실수 방지)
function updateAmountHint(){
  var d = parseInt(document.getElementById('deposit').value||'0',10)*10000;
  var r = parseInt(document.getElementById('rent').value||'0',10)*10000;
  document.getElementById('amountHint').textContent =
    '보증금 ' + d.toLocaleString() + '원 · 월차임 ' + r.toLocaleString() + '원 (저장 시 원 단위로 반영)';
}

// 호실 선택 → 등록된 부동산의 소재지(주소) 자동 연동
function onRoomChanged(){
  var rid = document.getElementById('roomId').value;
  var hint = document.getElementById('roomHint');
  var addrEl = document.getElementById('hostAddress');
  if(!rid){ hint.textContent=''; return; }
  var rm = ALL_ROOMS.find(function(r){ return String(r.id) === String(rid); });
  if(!rm){ hint.textContent=''; return; }
  var addr = rm.building_address || '';
  var roomNo = rm.room || rm.room_no || '';
  var full = (addr + (roomNo ? ' ' + roomNo + '호' : '')).trim();
  // 비어 있거나 이전 자동입력값이면 갱신 (사용자가 직접 고쳐둔 값은 보존)
  if(!addrEl.value.trim() || addrEl.dataset.auto === '1'){
    addrEl.value = full;
    addrEl.dataset.auto = '1';
  }
  hint.textContent = '🏠 ' + ((rm.building_name||'') + ' ' + roomNo + '호').trim() + (addr ? ' · ' + addr : '');
}

// 3) 호실 목록 로드
async function loadRooms(){
  try{
    var res=await fetch('/api/v1/rooms'); ALL_ROOMS=await res.json()||[];
    var sel=document.getElementById('roomId');
    ALL_ROOMS.forEach(function(rm){
      if(!rm.id) return;
      var o=document.createElement('option'); o.value=rm.id;
      o.textContent=((rm.building_name||'')+' '+(rm.room_no||'')).trim()+'호';
      sel.appendChild(o);
    });
  }catch(e){ console.error('호실 로드 실패',e); }
}

// 4) 저장
async function saveContract(){
  var editId = document.getElementById('editContractId').value;
  var payload={
    room_id: parseInt(document.getElementById('roomId').value||'0',10),
    host_address_full: document.getElementById('hostAddress').value.trim(),
    lease_type: document.getElementById('leaseType').value,
    // 입력은 '만원' 단위 → DB에는 '원' 단위로 저장 (×10,000)
    deposit_amount: (parseInt(document.getElementById('deposit').value||'0',10) * 10000),
    monthly_rent: (parseInt(document.getElementById('rent').value||'0',10) * 10000),
    maintenance_fee: parseInt(document.getElementById('maint').value||'0',10),
    start_date: document.getElementById('startDate').value,   // date8 → ISO 반환
    end_date: document.getElementById('endDate').value,
    special_terms: document.getElementById('specialTerms').value.trim()
  };
  if(!payload.start_date){ return alert('❌ 계약 시작일을 확인해 주세요.'); }

  // 당사자/여권/원본문서 메타는 documents_json 에 함께 보관 (스키마 변경 없이)
  var meta={
    files: DOC_FILES,            // 계약서 원본(여러 장)
    id_files: ID_FILES,          // 신분증 사본(여러 장)
    file: DOC_FILES[0] || null,  // 하위호환(기존 뷰어/명세서용 대표 1장)
    tenant:{name:val('tenantName'), rrn_masked:val('tenantRrn'), phone:val('tenantPhone')},
    vat_applied: document.getElementById('vatApplied').checked   // 부가세 적용 여부
  };
  payload.documents_json=JSON.stringify(meta);
  if (editId) payload.id = parseInt(editId, 10);      // 수정 모드

  try{
    var res=await fetch('/api/v1/contracts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    var d=await res.json();
    if(res.ok && (d.success||d.id)){
      alert(editId ? '✏️ 계약 내용이 수정되었습니다. (계약ID: '+editId+')'
                   : '✅ 계약서 저장 완료 (계약ID: '+(d.id||'?')+'). 원본문서도 함께 첨부되었습니다.');
      document.getElementById('contractForm').reset();
      resetContractForm();
      DOC_FILES=[]; ID_FILES=[];
      document.getElementById('docFileList').innerHTML='';
      document.getElementById('idFileList').innerHTML='';
      document.getElementById('vatApplied').checked=true;
      VIEW_IDX=0; switchViewer('doc');
    }else{
      alert('❌ 저장 실패: '+(d.error||'알 수 없는 오류'));
    }
  }catch(e){ alert('❌ 통신 오류: '+e.message); }
}
function val(id){ return (document.getElementById(id).value||'').trim(); }

// 수정 모드 해제 (새 계약 입력)
function resetContractForm(){
  document.getElementById('editContractId').value = '';
  document.getElementById('cEditBanner').style.display = 'none';
  document.getElementById('cSaveBtn').textContent = '💾 계약서 저장 (원본문서 첨부)';
  document.getElementById('cSaveBtn').style.background = '';
  document.getElementById('hostAddress').dataset.auto = '';
  DOC_FILES=[]; ID_FILES=[];
  document.getElementById('docFileList').innerHTML='';
  document.getElementById('idFileList').innerHTML='';
  document.getElementById('vatApplied').checked = true;
  VIEW_IDX=0; switchViewer('doc');
  updateAmountHint();
}

// 기존 계약 불러오기 (계약자 화면의 [수정] → contract_master.html?id=N)
async function loadContractForEdit(cid){
  try{
    var res = await fetch('/api/v1/contracts');
    var list = await res.json() || [];
    var c = list.find(function(x){ return String(x.id) === String(cid); });
    if(!c){ alert('계약 정보를 찾을 수 없습니다.'); return; }

    document.getElementById('editContractId').value = c.id;
    document.getElementById('roomId').value = c.room_id || '';
    document.getElementById('hostAddress').value = c.host_address_full || '';
    document.getElementById('hostAddress').dataset.auto = '0';
    document.getElementById('leaseType').value = c.lease_type || '월세';
    // DB는 원 단위 → 화면은 만원 단위
    document.getElementById('deposit').value = Math.floor((c.deposit_amount||0)/10000);
    document.getElementById('rent').value    = Math.floor((c.monthly_rent||0)/10000);
    document.getElementById('maint').value   = c.maintenance_fee || 0;
    document.getElementById('startDate').value = c.start_date || '';
    document.getElementById('endDate').value   = c.end_date || '';
    document.getElementById('specialTerms').value = c.special_terms || '';
    updateAmountHint();

    // documents_json 복원 (임차인 정보 / 첨부파일 / 부가세)
    try{
      var m = JSON.parse(c.documents_json || '{}');
      if(m.tenant){
        document.getElementById('tenantName').value  = m.tenant.name || c.tenant_name || '';
        document.getElementById('tenantRrn').value   = m.tenant.rrn_masked || '';
        document.getElementById('tenantPhone').value = m.tenant.phone || c.tenant_phone || '';
      } else {
        document.getElementById('tenantName').value  = c.tenant_name || '';
        document.getElementById('tenantPhone').value = c.tenant_phone || '';
      }
      document.getElementById('vatApplied').checked = (m.vat_applied !== false);
      DOC_FILES = Array.isArray(m.files) ? m.files : (m.file ? [m.file] : []);
      ID_FILES  = Array.isArray(m.id_files) ? m.id_files : (m.tenant_id_front ? [m.tenant_id_front] : []);
      renderFileList(DOC_FILES,'docFileList');
      renderFileList(ID_FILES,'idFileList');
      VIEW_IDX = 0; switchViewer('doc');
    }catch(e){}

    var b = document.getElementById('cEditBanner');
    b.style.display='';
    b.innerHTML = '✏️ <b>' + (c.tenant_name || '') + '</b> 계약(ID ' + c.id + ') 수정 중 — 고친 뒤 아래 버튼으로 저장하세요.';
    document.getElementById('cSaveBtn').textContent = '✏️ 수정 내용 저장';
    document.getElementById('cSaveBtn').style.background = '#fd7e14';
  }catch(e){ alert('계약 불러오기 오류: ' + e.message); }
}

document.addEventListener('DOMContentLoaded', async function(){
  await loadRooms();
  var q = new URLSearchParams(location.search).get('id');
  if(q) loadContractForEdit(q);
});
