<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>협력사 인적 데이터 명부 (broker/partner)</title>
    <style>
        :root { 
            --primary: #17a2b8; 
            --border: #dee2e6; 
            --bg: #f8f9fa; 
            --text-dark: #495057;
            --text-muted: #6c757d;
            --info: #0d6efd;
            --white: #ffffff;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; 
            display: flex; 
            height: 100vh; 
            overflow-y: auto; 
            background-color: var(--bg); 
        }
        
        .left-panel { width: 35%; background: var(--white); border-right: 1px solid var(--border); padding: 25px; box-sizing: border-box; overflow-y: auto; }
        .right-panel { flex: 1; padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; background: var(--white); }
        
        .panel-title { font-size: 0.95rem; color: var(--primary); margin: 0 0 20px 0; border-bottom: 2px solid var(--primary); padding-bottom: 8px; font-weight: bold; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; color: var(--text-dark); }
        .form-control { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.88rem; box-sizing: border-box; }
        
        .row-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .filter-divider { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin: 20px 0 15px 0; position: relative; }
        /* 명부 검색칸 — 자기가 거르는 표 바로 위에 둔다 */
        .roster-search { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .roster-search input { flex: 1; padding: 9px 12px; border: 1px solid var(--border);
                               border-radius: 5px; font-size: 0.9rem; }
        .roster-search input:focus { outline: none; border-color: var(--primary);
                                     box-shadow: 0 0 0 2px rgba(0,0,0,.05); }
        #searchCount { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }
        
        .btn-box { margin-top: 15px; display: flex; gap: 8px; }
        /* 저장 버튼은 항상 화면에 남는다 — 입력칸이 늘어나도 아래로 밀려 사라지지 않는다.
           검색칸을 우측 표 위로 옮기면서 이 버튼이 폼의 마지막 요소가 되어,
           다른 화면들과 똑같이 아래 여백까지 상쇄할 수 있게 됐다. */
        .btn-box { position: sticky; bottom: 0; z-index: 5; background: #fff;
                   border-top: 1px solid var(--border);
                   padding: 10px 25px; margin-left: -25px; margin-right: -25px; margin-bottom: -25px;
                   box-shadow: 0 -5px 12px rgba(0,0,0,.07); }
        .btn { padding: 10px; border: none; border-radius: 4px; font-size: 0.85rem; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-main { background: var(--primary); color: var(--white); flex: 2; }
        .btn-sub { background: var(--text-muted); color: var(--white); flex: 1; }
        
        .excel-table-wrap { flex: 1; overflow: auto; border: 1px solid #bbc4cc; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th { background: #f1f3f5; border: 1px solid #bbc4cc; padding: 6px 8px; font-weight: 600; position: sticky; top: 0; text-align: center; white-space: nowrap; color: #212529; }
        td { border: 1px solid #ced4da; padding: 6px 8px; white-space: nowrap; color: #333; }
        
        tr:nth-child(even) { background-color: var(--bg); }
        tr.selected { background-color: #e2f4f7 !important; }
        tr:hover { background-color: #e8f4fd; cursor: pointer; }
        
        .cell-text-center { text-align: center; }
        .cell-num-right { text-align: right; }
        
        .actions-btn { background: var(--info); color: var(--white); border: none; padding: 4px 12px; border-radius: 3px; cursor: pointer; font-size: 0.78rem; }
        .doc-card { border: 1px solid var(--border); border-radius: 4px; padding: 8px; margin-bottom: 8px; background: var(--bg); }
        .doc-card-title { font-weight: 600; font-size: 0.72rem; margin-bottom: 4px; color: var(--text-dark); }
    </style>
<script src="guard.js"></script>
</head>
<body>
    <div class="left-panel">
        <div class="panel-title" id="formPanelTitle">👥 협력사 정보 등록·수정</div>
        
        <form id="partnerForm" onsubmit="event.preventDefault(); savePartner();">
            <input type="hidden" id="partnerId" value="">

            <!-- 구분(중개사/일반협력사)은 따로 고르지 않습니다. 업종에서 자동으로 정해집니다.
                 예전에는 구분과 업종을 둘 다 입력했는데, 업종에 '부동산중개'라고 쓰면
                 구분은 자동으로 중개사입니다. 같은 걸 두 번 입력하게 되어 있었고
                 둘이 어긋나면 어느 쪽이 맞는지 알 수 없었습니다. (2026-08-05) -->
            <div class="form-group">
                <label>업종 <span style="font-weight:400;color:var(--text-muted);font-size:.72rem">— 칸을 누르면 자주 쓰는 업종이 뜹니다</span></label>
                <input type="text" id="partnerBizType" class="form-control" list="bizTypeList"
                       placeholder="예: 부동산중개, 전기설비, 상하수도" oninput="showDerivedCategory()">
                <datalist id="bizTypeList">
                    <option value="부동산중개">
                    <option value="전기설비">
                    <option value="상하수도">
                    <option value="도시가스">
                    <option value="승강기">
                    <option value="소방설비">
                    <option value="냉난방">
                    <option value="청소">
                    <option value="인터넷·통신">
                    <option value="세무·회계">
                </datalist>
                <input type="hidden" id="partnerCategory" value="partner">
                <div id="categoryHint" style="font-size:.76rem;color:var(--text-muted);margin-top:4px"></div>
            </div>

            <div class="form-group">
                <label>상호명 또는 법인명</label>
                <input type="text" id="partnerCompany" class="form-control" placeholder="예: 공인중개사 팩토리" required>
            </div>

            <div class="row-grid-2">
                <div class="form-group">
                    <label>대표자 성명</label>
                    <input type="text" id="partnerRepName" class="form-control" placeholder="실명 입력">
                </div>
                <div class="form-group">
                    <label>전화번호</label>
                    <input type="text" id="partnerPhone" class="form-control" placeholder="010-9876-5432" required maxlength="14" oninput="validatePhoneFormat(this)">
                </div>
            </div>

            <div class="form-group">
                <label>사업자등록번호</label>
                <input type="text" id="partnerBizNo" class="form-control" placeholder="예: 123-45-67890">
            </div>

            <div class="form-group">
                <label>등록 계좌번호</label>
                <input type="text" id="partnerAccount" class="form-control" placeholder="예: 국민 123456-01-789012 (은행명 포함)">
            </div>

            <div class="form-group">
                <label>이메일 주소</label>
                <input type="email" id="partnerEmail" class="form-control" placeholder="이메일 입력" oninput="this.value = this.value.toLowerCase();">
            </div>

            <div class="form-group">
                <label>사업자등록증 / 신분증 사본</label>
                <div class="doc-card">
                    <div class="doc-card-title">📄 증빙 서류 업로드 (USB 저장)</div>
                    <input type="file" id="partnerDocFile" class="form-control" accept=".pdf,.jpg,.jpeg,.png">
                </div>
            </div>

            <div class="btn-box">
                <button type="submit" id="btnSubmit" class="btn btn-main">정보 저장/수정</button>
                <button type="button" class="btn btn-sub" onclick="resetForm()">비우기</button>
            </div>

        </form>
    </div>

    <div class="right-panel">
        <div class="panel-title">📋 등록된 협력사 명부 (행 클릭 시 좌측에 자동 로드)</div>
        <!-- 검색칸은 자기가 거르는 표 바로 위에 둔다.
             ⚠️ 예전에는 좌측 등록 폼 안에 있었다. <form> 안의 입력칸에서 Enter 를 치면
                브라우저가 폼을 제출해 savePartner() 가 돌았다. 표에서 협력사를 클릭해
                좌측에 불러온 상태였다면 그 협력사가 조용히 다시 저장됐다.
                폼 밖으로 빼서 그 경로를 없앴다. (2026-08-05)
             구분 필터는 없앴다 — 표에 [구분] 열이 이미 보이고, 값이 두 개뿐이라
             검색어 한 칸으로 충분하다. -->
        <div class="roster-search">
            <input type="text" id="globalSearchInput" onkeyup="searchPartner()"
                   placeholder="🔍 상호 · 대표자 · 전화번호 · 업종으로 검색">
            <span id="searchCount"></span>
        </div>
        <div class="excel-table-wrap">
            <table id="partnerTable">
                <thead>
                    <tr>
                        <th>구분</th>
                        <th>상호명 / 법인명</th>
                        <th>대표자 성명</th>
                        <th>전화번호</th>
                        <th>이메일</th>
                        <th>계좌번호</th>
                        <th>사업자등록번호</th>
                        <th>업종 / 분류</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="partnerTbody">
                    <tr>
                        <td colspan="9" class="cell-text-center">데이터를 불러오는 중입니다...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="date8.js"></script>
<script>
        var ALL_PARTNERS = [];

        function validatePhoneFormat(obj) {
            let val = obj.value.replace(/[^0-9]/g, '');
            if (val.length > 3 && val.length <= 7) {
                obj.value = val.substring(0, 3) + '-' + val.substring(3);
            } else if (val.length > 7) {
                obj.value = val.substring(0, 3) + '-' + val.substring(3, 7) + '-' + val.substring(7, 11);
            } else {
                obj.value = val;
            }
        }

        // 1. 백엔드에서 협력사/중개사 목록 로드 (GET /api/v1/contacts)
        async function loadPartners() {
            try {
                const res = await fetch('/api/v1/contacts');
                const list = await res.json() || [];
                
                // broker 및 partner 카테고리만 필터링
                ALL_PARTNERS = list.filter(item => item.category === 'broker' || item.category === 'partner');
                searchPartner();   // 검색어가 남아 있어도 반영되고, 건수 표시도 같이 갱신된다
            } catch(e) {
                console.error('[협력사 로드 오류]', e);
            }
        }

        // 2. 우측 테이블 렌더링
        function renderPartnerTable(list) {
            const tbody = document.getElementById('partnerTbody');
            tbody.innerHTML = '';

            if (!list || list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="cell-text-center">등록된 협력사 정보가 없습니다.</td></tr>';
                return;
            }

            list.forEach(item => {
                const tr = document.createElement('tr');
                tr.onclick = function() { loadToForm(item, tr); };

                const categoryLabel = item.category === 'broker' ? '중개사' : '일반 협력사';

                tr.innerHTML = `
                    <td class="cell-text-center" data-val="${item.category}">${categoryLabel}</td>
                    <td class="cell-text-center td-company"><b>${item.company_or_name || item.name || '-'}</b></td>
                    <td class="cell-text-center td-rep">${item.representative_name || item.rep || '-'}</td>
                    <td class="cell-num-right td-phone">${item.contact_info || item.phone || '-'}</td>
                    <td class="cell-text-center td-email">${item.email || '-'}</td>
                    <td class="cell-text-center td-account">${item.account_no || '-'}</td>
                    <td class="cell-text-center td-bizno">${item.biz_no || '-'}</td>
                    <td class="cell-text-center td-biztype">${item.role || '일반'}</td>
                    <td class="cell-text-center">
                        <button class="actions-btn" onclick="event.stopPropagation(); loadToForm(${JSON.stringify(item).replace(/"/g, '&quot;')}, this.closest('tr'))">수정</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 업종 → 구분(category) 판정. 규칙은 여기 한 곳에만 둔다.
        //   중개 업무면 broker, 나머지는 전부 partner(일반 협력사).
        //   DB 의 category 컬럼은 임차인(tenant)·직원(staff)도 함께 쓰므로 없앨 수 없다.
        //   화면에서 고르게 하지 않을 뿐, 값은 계속 저장된다.
        function categoryFromBizType(bizType) {
            var t = String(bizType || '');
            return /중개|공인중개|부동산/.test(t) ? 'broker' : 'partner';
        }

        // 어느 구분으로 저장되는지 화면에 보여 준다 (몰래 정해지면 안 된다)
        function renderCategoryHint() {
            var hint = document.getElementById('categoryHint');
            if (!hint) return;
            var bizType = document.getElementById('partnerBizType').value.trim();
            var cat = document.getElementById('partnerCategory').value || 'partner';
            hint.innerHTML = bizType
                ? '구분: <b>' + (cat === 'broker' ? '중개사' : '일반 협력사') + '</b> 로 저장됩니다'
                : '구분은 업종에 따라 자동으로 정해집니다 (중개 업무 → 중개사)';
        }

        // 업종을 고치면 그때 구분을 다시 정한다.
        //   ⚠️ 불러오기(loadToForm)에서는 부르지 않는다. 기존에 저장된 구분을 존중해야 한다
        //      (예전에 손으로 '중개사'로 지정해 둔 협력사를 업종만 보고 바꿔버리면 안 된다)
        function showDerivedCategory() {
            document.getElementById('partnerCategory').value =
                categoryFromBizType(document.getElementById('partnerBizType').value.trim());
            renderCategoryHint();
        }

        // 3. 선택한 행의 데이터를 좌측 폼에 바인딩
        function loadToForm(item, row) {
            document.querySelectorAll('#partnerTable tbody tr').forEach(r => r.classList.remove('selected'));
            if(row) row.classList.add('selected');

            document.getElementById('partnerId').value = item.id;
            document.getElementById('partnerCategory').value = item.category || 'partner';
            document.getElementById('partnerCompany').value = item.company_or_name || item.name || '';
            document.getElementById('partnerRepName').value = item.representative_name || item.rep || '';
            document.getElementById('partnerPhone').value = item.contact_info || item.phone || '';
            document.getElementById('partnerEmail').value = item.email || '';
            document.getElementById('partnerBizType').value = item.role || '';
            document.getElementById('partnerAccount').value = item.account_no || '';
            document.getElementById('partnerBizNo').value = item.biz_no || '';   // 사업자등록번호
            renderCategoryHint();   // 저장된 구분을 그대로 보여 준다 (다시 판정하지 않는다)

            document.getElementById('formPanelTitle').innerText = `📝 협력사 정보 수정 (${item.company_or_name || item.name})`;
            document.getElementById('btnSubmit').innerText = "변경사항 수정 적용";
        }

        function resetForm() {
            document.getElementById('partnerId').value = "";
            document.getElementById('partnerForm').reset();
            // form.reset() 은 hidden 칸을 HTML 의 초기값으로 되돌린다 → 'partner'
            document.getElementById('partnerCategory').value = 'partner';
            renderCategoryHint();
            document.getElementById('formPanelTitle').innerText = "👥 협력사 정보 등록·수정";
            document.getElementById('btnSubmit').innerText = "정보 저장/수정";
            document.querySelectorAll('#partnerTable tbody tr').forEach(r => r.classList.remove('selected'));
        }

        // 4. 협력사 저장 (POST /api/v1/contacts)
        async function savePartner() {
            const id = document.getElementById('partnerId').value;
            const companyName = document.getElementById('partnerCompany').value.trim();
            const category = document.getElementById('partnerCategory').value;
            const repName = document.getElementById('partnerRepName').value.trim();
            const phone = document.getElementById('partnerPhone').value.trim();
            const email = document.getElementById('partnerEmail').value.trim();
            const bizType = document.getElementById('partnerBizType').value.trim();
            const account = document.getElementById('partnerAccount').value.trim();
            const bizNo = document.getElementById('partnerBizNo').value.trim();   // 사업자등록번호

            if (!companyName || !phone) {
                return alert('❌ 필수 항목(상호명, 전화번호)을 입력해 주세요.');
            }

            const payload = {
                category: category,
                company_or_name: companyName,
                representative_name: repName,
                contact_info: phone,
                email: email,
                role: bizType,
                account_no: account,
                biz_no: bizNo            // ⚠️ 빠뜨리면 조용히 사라집니다. 세금계산서에 필요한 정보입니다
            };

            if (id) {
                payload.id = parseInt(id, 10);
            }

            // 증빙 서류(PDF/이미지) 선택 시 서버 저장 구역에 업로드 후 경로 저장
            const fileEl = document.getElementById('partnerDocFile');
            if (fileEl && fileEl.files && fileEl.files[0]) {
                const f = fileEl.files[0];
                try {
                    const up = await fetch('/api/v1/upload', {
                        method: 'POST',
                        headers: { 'X-File-Name': encodeURIComponent(f.name) },
                        body: f
                    });
                    const ud = await up.json();
                    if (ud.filepath) {
                        payload.documents_json = JSON.stringify([{ name: f.name, path: ud.filepath }]);
                    } else {
                        return alert('❌ 서류 업로드 실패: ' + (ud.error || '알 수 없는 오류'));
                    }
                } catch (e) {
                    return alert('❌ 서류 업로드 통신 오류: ' + e.message);
                }
            }

            try {
                const res = await fetch('/api/v1/contacts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert(id ? `✅ [수정 완료] ${companyName} 정보가 갱신되었습니다.` : `✅ [등록 완료] 신규 협력사 등록 완료`);
                    resetForm();
                    loadPartners();
                } else {
                    const err = await res.json();
                    alert('❌ 저장 실패: ' + (err.error || '알 수 없는 오류'));
                }
            } catch(e) {
                alert('❌ 통신 오류: ' + e.message);
            }
        }

        // 5. 실시간 검색 및 필터
        function searchPartner() {
            const query = document.getElementById('globalSearchInput').value.toLowerCase().trim();

            // ⚠️ 사업자등록번호(biz_no)는 검색 대상이 아니다. 그걸로 찾는 일은 없다.
            //    전화번호는 contact_info 에 들어 있다 (item.phone 은 비어 있을 수 있어 둘 다 본다).
            const filtered = ALL_PARTNERS.filter(item => {
                if (!query) return true;
                const str = [item.company_or_name, item.representative_name,
                             item.contact_info, item.phone, item.role]
                            .filter(Boolean).join(' ').toLowerCase();
                return str.includes(query);
            });

            const cnt = document.getElementById('searchCount');
            if (cnt) cnt.textContent = query
                ? filtered.length + '건 / 전체 ' + ALL_PARTNERS.length + '건'
                : '전체 ' + ALL_PARTNERS.length + '건';

            renderPartnerTable(filtered);
        }

        document.addEventListener('DOMContentLoaded', function(){
            renderCategoryHint();   // 처음 열었을 때도 구분 안내가 보이게
            loadPartners();
        });
    </script>
</body>
</html>
