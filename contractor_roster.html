<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>계약자 인적 데이터 명부 (엑셀 통합형)</title>
    <style>
        :root { 
            --primary: #6f42c1; 
            --border: #dee2e6; 
            --bg: #f8f9fa; 
            --text-dark: #495057;
            --text-muted: #6c757d;
            --success: #28a745;
            --danger: #dc3545;
            --info: #0d6efd;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            background-color: var(--bg); 
        }
        
        .left-panel { width: 35%; background: white; border-right: 1px solid var(--border); padding: 25px; box-sizing: border-box; overflow-y: auto; }
        .right-panel { flex: 1; padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; background: white; overflow: hidden; }
        
        .panel-title { font-size: 0.95rem; color: var(--primary); margin: 0 0 20px 0; border-bottom: 2px solid var(--primary); padding-bottom: 8px; font-weight: bold; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; color: var(--text-dark); }
        .form-control { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.88rem; box-sizing: border-box; }
        
        .date-range-box { display: flex; align-items: center; gap: 8px; }
        .date-range-box input { flex: 1; }
        
        .btn-box { margin-top: 15px; display: flex; gap: 8px; }
        .btn { padding: 10px; border: none; border-radius: 4px; font-size: 0.85rem; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-main { background: var(--primary); color: white; flex: 1; }
        .btn-sub { background: var(--text-muted); color: white; }
        
        .excel-table-wrap { flex: 1; overflow: auto; border: 1px solid #bbc4cc; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th { background: #f1f3f5; border: 1px solid #bbc4cc; padding: 8px 8px; font-weight: 600; position: sticky; top: 0; text-align: center; white-space: nowrap; z-index: 10; }
        td { border: 1px solid #ced4da; padding: 6px 8px; white-space: nowrap; color: #333; }
        tr:nth-child(even) { background-color: var(--bg); }
        tr:hover { background-color: #e8f4fd; cursor: pointer; }
        
        .cell-text-center { text-align: center; }
        .cell-num-right { text-align: right; }
        
        .status-badge { font-weight: bold; padding: 2px 6px; border-radius: 3px; font-size: 0.75rem; }
        .status-active { color: var(--success); background: #e8f5e9; }
        .status-ended { color: var(--danger); background: #ffebee; }
        
        .actions-btn { background: var(--info); color: white; border: none; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 0.78rem; }
        .file-view-btn { background: var(--success); color: white; text-decoration: none; display: inline-block; padding: 4px 8px; border-radius: 3px; font-size: 0.72rem; }
        .file-none { color: var(--text-muted); font-size: 0.75rem; }
        
        .display-none { display: none; }
    </style>
<script src="guard.js"></script>
</head>
<body>
    <div class="left-panel">
        <div class="panel-title">👥 계약자 검색·조회</div>

        <div style="background:#fff3cd;border:1px solid #ffe08a;border-left:5px solid #f0ad4e;border-radius:6px;padding:11px 13px;margin-bottom:16px;font-size:0.88rem;color:#664d03;line-height:1.55;">
            📄 <b>명세서(공과금·월세)는 여기서 출력합니다.</b><br>
            임차인이 방문해 요금을 물으면, 오른쪽 목록에서 해당 계약자의 <b>[📄 명세서]</b> 버튼을 눌러 뽑아 주세요.
        </div>

        <form onsubmit="event.preventDefault(); filterContractors();">
            <div class="form-group">
                <label>전체 검색</label>
                <input type="text" class="form-control" id="globalSearchInput" placeholder="이름·전화·주소·상호명 모두 검색" onkeyup="filterContractors()">
            </div>

            <div class="form-group">
                <label>호실 검색</label>
                <input type="text" class="form-control" id="roomFilterInput" placeholder="예: 101호 또는 201호" onkeyup="filterContractors()">
            </div>

            <div class="form-group">
                <label>계약 잔여 기간 검색 (계약 종료일 기준)</label>
                <div class="date-range-box">
                    <input type="text" class="form-control" id="startDateFilter" placeholder="YYYY-MM-DD" maxlength="10" onchange="filterContractors()" />                    <span>~</span>
                    <input type="date" class="form-control" id="endDateFilter" onchange="filterContractors()">
                </div>
            </div>

            <div class="btn-box">
                <button type="button" class="btn btn-main" onclick="filterContractors()">검색 적용</button>
                <button type="button" class="btn btn-sub" onclick="resetFilters()">초기화</button>
            </div>
        </form>
    </div>

    <div class="right-panel">
        <div class="panel-title">📋 등록된 계약자 명부 (조회/수정)</div>
        
        <div class="excel-table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>호실 / 주소</th>
                        <th>계약자 상호 / 성명</th>
                        <th>전화번호</th>
                        <th>계약 시작일</th>
                        <th>계약 종료일</th>
                        <th>계약 상태</th>
                        <th>증빙 서류</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="contractorTableBody">
                    <tr>
                        <td colspan="8" class="cell-text-center">데이터를 불러오는 중입니다...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        var ALL_CONTRACTS = [];
        var ALL_BILLS = [];
        var TODAY_STR = new Date().toISOString().split('T')[0];

        async function loadContractors() {
            try {
                // 1. 계약서 및 연관된 contacts 데이터 조회
                const res = await fetch('/api/v1/contracts');
                ALL_CONTRACTS = await res.json() || [];
                
                // 2. 임차인 인적사항 조회를 위한 contacts 전체 목록 확보
                const cRes = await fetch('/api/v1/contacts?category=tenant');
                const contactsList = await cRes.json() || [];
                const contactMap = {};
                contactsList.forEach(c => { contactMap[c.id] = c; });

                // 3. 계약 데이터에 인적사항 매핑
                ALL_CONTRACTS.forEach(ctr => {
                    if (ctr.tenant_contact_id && contactMap[ctr.tenant_contact_id]) {
                        const tc = contactMap[ctr.tenant_contact_id];
                        ctr.tenant_name = tc.company_or_name || tc.name || ctr.tenant_name;
                        ctr.tenant_phone = tc.contact_info || tc.phone || '-';
                    }
                });

                // 4. 공과금(bills) 확보 — 명세서 출력용
                const bRes = await fetch('/api/v1/bills');
                ALL_BILLS = await bRes.json() || [];

                renderTable(ALL_CONTRACTS);
            } catch (e) {
                console.error('[계약자 명부 로드 오류]', e);
                document.getElementById('contractorTableBody').innerHTML = 
                    '<tr><td colspan="8" class="cell-text-center" style="color:var(--danger)">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>';
            }
        }

        function renderTable(dataList) {
            const tbody = document.getElementById('contractorTableBody');
            tbody.innerHTML = '';

            if (!dataList || dataList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="cell-text-center">조회된 계약자 내역이 없습니다.</td></tr>';
                return;
            }

            dataList.forEach(ctr => {
                const tr = document.createElement('tr');

                // 계약 상태 판단 (종료일 기준)
                const isEnded = ctr.end_date && ctr.end_date < TODAY_STR;
                const statusHtml = isEnded 
                    ? '<span class="status-badge status-ended">계약종료</span>' 
                    : '<span class="status-badge status-active">계약중</span>';

                // 서류 파일 열람 링크
                let docsHtml = '<span class="file-none">미첨부</span>';
                if (ctr.documents_json) {
                    try {
                        const docs = JSON.parse(ctr.documents_json);
                        if (Array.isArray(docs) && docs.length > 0) {
                            const validDoc = docs.find(d => d.path || d.name);
                            if (validDoc) {
                                const filePath = validDoc.path || ('uploads/' + validDoc.name);
                                docsHtml = `<a href="/${filePath}" target="_blank" class="file-view-btn">서류 보기</a>`;
                            }
                        }
                    } catch(e) {}
                }

                // 주소 및 호실 조합
                const roomInfo = ctr.room_no ? `${ctr.room_no}호` : (ctr.host_address_full || '-');

                tr.innerHTML = `
                    <td class="cell-text-center">${roomInfo}</td>
                    <td class="cell-text-center"><strong>${ctr.tenant_name || '-'}</strong></td>
                    <td class="cell-text-center">${ctr.tenant_phone || '-'}</td>
                    <td class="cell-num-right">${ctr.start_date || '-'}</td>
                    <td class="cell-num-right">${ctr.end_date || '-'}</td>
                    <td class="cell-text-center">${statusHtml}</td>
                    <td class="cell-text-center">${docsHtml}</td>
                    <td class="cell-text-center">
                        <button class="actions-btn" style="background:#6f42c1" onclick="printStatement(${ctr.id})">📄 명세서</button>
                        <button class="actions-btn" onclick="editContractor(${ctr.id})">수정</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterContractors() {
            const globalKw = document.getElementById('globalSearchInput').value.trim().toLowerCase();
            const roomKw = document.getElementById('roomFilterInput').value.trim().toLowerCase();
            const startDt = document.getElementById('startDateFilter').value;
            const endDt = document.getElementById('endDateFilter').value;

            const filtered = ALL_CONTRACTS.filter(ctr => {
                // 1. 전체 검색 (이름, 전화, 주소, 호실)
                const targetStr = `${ctr.tenant_name || ''} ${ctr.tenant_phone || ''} ${ctr.host_address_full || ''} ${ctr.room_no || ''}`.toLowerCase();
                if (globalKw && !targetStr.includes(globalKw)) return false;

                // 2. 호실 전용 검색
                const roomStr = `${ctr.room_no || ''} ${ctr.host_address_full || ''}`.toLowerCase();
                if (roomKw && !roomStr.includes(roomKw)) return false;

                // 3. 종료일 범위 검색
                if (startDt && ctr.end_date < startDt) return false;
                if (endDt && ctr.end_date > endDt) return false;

                return true;
            });

            renderTable(filtered);
        }

        function resetFilters() {
            document.getElementById('globalSearchInput').value = '';
            document.getElementById('roomFilterInput').value = '';
            document.getElementById('startDateFilter').value = '';
            document.getElementById('endDateFilter').value = '';
            renderTable(ALL_CONTRACTS);
        }

        // 계약서(B) 화면으로 이동해 해당 계약을 불러와 수정
        function editContractor(contractId) {
            location.href = 'contract_master.html?id=' + contractId;
        }

        // 📄 임차인 공과금·월세 명세서 출력 (인쇄창)
        function printStatement(contractId) {
            var ctr = ALL_CONTRACTS.find(function(c){ return c.id == contractId; });
            if (!ctr) { alert('계약 정보를 찾을 수 없습니다.'); return; }
            var bill = ALL_BILLS.find(function(b){ return b.room_id == ctr.room_id; }) || {};
            var t10 = function(n){ n = Math.floor(Number(n)||0); return Math.floor(n/10)*10; };
            var won = function(n){ return (Number(n)||0).toLocaleString() + '원'; };
            var rent = Number(ctr.monthly_rent)||0, maint = Number(ctr.maintenance_fee)||0;
            var elec = Number(bill.elec_cost)||0, water = Number(bill.water_cost)||0, gas = Number(bill.gas_cost)||0, net = Number(bill.net_cost)||0;
            var grand = rent + maint + elec + water + gas + net;
            var room = ctr.room_no ? (ctr.room_no + '호') : (ctr.host_address_full || '-');
            var today = new Date().toISOString().split('T')[0];
            var elecNote = (!elec && bill.elec_usage) ? ' (검침 ' + bill.elec_usage + 'kWh)' : '';
            var html = ''
              + '<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>공과금·월세 명세서</title><style>'
              + 'body{font-family:"Malgun Gothic",sans-serif;color:#222;padding:24px;max-width:640px;margin:0 auto}'
              + 'h1{text-align:center;font-size:1.5rem;border-bottom:3px solid #6f42c1;padding-bottom:10px;color:#6f42c1}'
              + '.meta{text-align:right;color:#666;font-size:.85rem;margin:8px 0 18px}'
              + 'table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:.95rem}'
              + 'th,td{border:1px solid #ccc;padding:9px 12px}th{background:#f3f0fa;text-align:left;width:42%}td{text-align:right}td.l{text-align:left}'
              + '.sec{font-weight:bold;color:#6f42c1;margin:14px 0 6px;font-size:1.05rem}'
              + '.total th,.total td{background:#faf7ff;font-size:1.2rem;font-weight:bold}'
              + '.foot{margin-top:20px;font-size:.8rem;color:#888;border-top:1px solid #ddd;padding-top:10px}'
              + '@media print{@page{size:A4;margin:14mm}body{padding:0}}'
              + '</style></head><body>'
              + '<h1>공과금 · 월세 명세서</h1>'
              + '<div class="meta">발행일: ' + today + '</div>'
              + '<div class="sec">■ 임차인 / 호실</div><table>'
              + '<tr><th>임차인</th><td class="l">' + (ctr.tenant_name||'-') + '</td></tr>'
              + '<tr><th>연락처</th><td class="l">' + (ctr.tenant_phone||'-') + '</td></tr>'
              + '<tr><th>호실 / 주소</th><td class="l">' + room + (ctr.host_address_full ? ' ('+ctr.host_address_full+')' : '') + '</td></tr>'
              + '<tr><th>계약 기간</th><td class="l">' + (ctr.start_date||'-') + ' ~ ' + (ctr.end_date||'-') + '</td></tr>'
              + '</table>'
              + '<div class="sec">■ 청구 내역</div><table>'
              + '<tr><th>월세</th><td>' + won(t10(rent)) + '</td></tr>'
              + '<tr><th>관리비</th><td>' + won(t10(maint)) + '</td></tr>'
              + '<tr><th>전기요금</th><td>' + won(t10(elec)) + elecNote + '</td></tr>'
              + '<tr><th>수도요금</th><td>' + won(t10(water)) + '</td></tr>'
              + '<tr><th>가스요금</th><td>' + won(t10(gas)) + '</td></tr>'
              + '<tr><th>통신요금</th><td>' + won(t10(net)) + '</td></tr>'
              + '<tr class="total"><th>합계 (총 청구액)</th><td>' + won(t10(grand)) + '</td></tr>'
              + '</table>'
              + (bill.due_date ? '<div class="l" style="text-align:left">납부 기한: ' + bill.due_date + '</div>' : '')
              + '<div class="foot">본 명세서는 참고용 출력물입니다.</div>'
              + '</body></html>';
            var w = window.open('', '_blank', 'width=720,height=900');
            if (!w) { alert('팝업이 차단되었습니다. 브라우저에서 이 사이트의 팝업을 허용한 뒤 다시 시도하세요.'); return; }
            w.document.write(html); w.document.close();
            setTimeout(function(){ try { w.focus(); w.print(); } catch(e){} }, 400);
        }

        document.addEventListener('DOMContentLoaded', loadContractors);
    </script>
</body>
</html>
