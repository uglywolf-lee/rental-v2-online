<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>부동산 자산 및 호실 관리 (엑셀 통합형)</title>
    <style>
        :root { 
            --primary: #28a745; 
            --border: #dee2e6; 
            --bg: #f8f9fa; 
            --text-dark: #495057;
            --text-muted: #6c757d;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;  
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: var(--bg); 
        }
        
        .left-panel { width: 35%; background: white; border-right: 1px solid var(--border); padding: 25px; overflow-y: auto; box-sizing: border-box; }
        .right-panel { width: 65%; padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; background: white; }
        .panel-title { font-size: 1.1rem; color: var(--primary); margin: 0 0 20px 0; border-bottom: 2px solid var(--primary); padding-bottom: 8px; font-weight: bold; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; color: var(--text-dark); }
        .form-control { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.88rem; box-sizing: border-box; }
        .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .btn-box { margin-top: 15px; display: flex; gap: 8px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 0.85rem; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-main { background: var(--primary); color: white; }
        .btn-sub { background: #6c757d; color: white; }
        
        .excel-table-wrap { flex: 0 1 auto; min-height: 0; overflow: auto; border: 1px solid #bbc4cc; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th { background: #f1f3f5; border: 1px solid #bbc4cc; padding: 6px 8px; font-weight: 600; position: sticky; top: 0; text-align: center; color: #212529; white-space: nowrap; }
        td { border: 1px solid #ced4da; padding: 4px 8px; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #e8f4fd; cursor: pointer; }
        
        .cell-text-center { text-align: center; }
        .cell-num-right { text-align: right; }
        
        .col-no { min-width: 45px; max-width: 60px; width: 50px; text-align: right; }
        .th-no { min-width: 45px; max-width: 60px; width: 50px; text-align: center; }
        .col-active { min-width: 55px; max-width: 70px; width: 60px; text-align: right; }
        .th-active { min-width: 55px; max-width: 70px; width: 60px; text-align: center; }
    </style>
<script src="guard.js"></script>
</head>
<body>

    <div class="left-panel">
        <div class="panel-title">🏠 A. 부동산/호실 인프라등록</div>

        <div style="background:#f1f3f5;border-radius:6px;padding:9px 10px;margin-bottom:14px">
            <label style="display:block;font-size:.8rem;font-weight:700;color:#495057;margin-bottom:5px">🔍 호실 검색 후 불러오기</label>
            <input type="text" id="leftSearch" class="form-control" placeholder="예: 440 → 4층 전체" autocomplete="off"
                   oninput="renderLeftChips(this.value)"
                   onkeydown="if(event.key==='Enter'){event.preventDefault();renderLeftChips(this.value);}">
            <div id="leftChips" style="margin-top:6px"></div>
        </div>
        <form onsubmit="handleAssetSubmit(event)">
            <div class="form-group">
                <label>건물명</label>
                <input type="text" class="form-control" id="buildingName" placeholder="예: 구로 디지털 타워 A동" required>
            </div>
            <div class="form-group">
                <label>실제 주소</label>
                <input type="text" class="form-control" id="actualAddress" placeholder="식별 및 연동 주소 입력" required>
            </div>
            <div class="form-group">
                <label>호실 번호</label>
                <input type="text" class="form-control" id="roomNumber" placeholder="예: 440 (4층 40호)" oninput="autoFillFloor()" required>
            </div>
            <div class="form-group">
                <label>층 <span style="font-weight:400;color:#888;">(호실번호에서 자동 · 지하/비정형이면 수정)</span></label>
                <input type="number" class="form-control" id="assignedFloor" placeholder="자동 산출">
            </div>
            <div class="form-group">
                <label>전용 면적 ㎡</label>
                <input type="number" step="0.001" class="form-control" id="roomArea" placeholder="소수점 3자리">
            </div>
            <div class="form-group">
                <label>상태</label>
                <select class="form-control" id="roomStatus">
                    <option value="공실">공실</option>
                    <option value="임대">임대</option>
                    <option value="공사중">공사중</option>
                </select>
            </div>
            <input type="hidden" id="selectedRoomId" value="">
            <input type="hidden" id="selectedBuildingId" value="">
            <div id="editBanner" style="display:none;background:#fff3cd;border:1px solid #ffe08a;border-left:4px solid #f0ad4e;border-radius:5px;padding:8px 10px;margin-bottom:10px;font-size:.82rem;color:#664d03"></div>
            <div class="btn-box">
                <button type="submit" class="btn btn-main">신규 자산 등록</button>
                <button type="button" class="btn btn-sub" onclick="handleAssetUpdate()">현황 변경 (수정)</button>
            </div>
            <div class="btn-box" style="margin-top:8px">
                <button type="button" class="btn btn-sub" style="background:#adb5bd" onclick="resetAssetForm()">새로 입력 (선택 해제)</button>
            </div>
        </form>
    </div>

    <div class="right-panel">
        <div style="display: grid; grid-template-columns: 1fr auto; gap: 10px;">
            <input type="text" id="searchKeyword" class="form-control" placeholder="건물명·주소·호실 검색 (440 입력 시 4층 전체)"
                   autocomplete="off" oninput="renderRoomTable()"
                   onkeydown="if(event.key==='Enter'){event.preventDefault();renderRoomTable();}">
            <button class="btn btn-main" style="flex:none; width:80px;" onclick="renderRoomTable()">검색</button>
        </div>
        <div class="excel-table-wrap">
            <table>
                <thead>
                    <tr>
                        <th class="th-no">No.</th>
                        <th>건물명</th>
                        <th>주소</th>
                        <th>층수</th>
                        <th>호실</th>
                        <th>면적 (㎡)</th>
                        <th>입주자 정보 (상호/성명)</th>
                        <th>상태</th>
                        <th class="th-active">활성</th>
                        <th style="width:70px">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="col-no">1</td>
                        <td class="cell-text-center">구로 테크노타운</td>
                        <td class="cell-text-center">서울시 구로구 디지털로 30길 12</td>
                        <td class="cell-text-center">2</td>
                        <td class="cell-text-center">201호</td>
                        <td class="cell-num-right">84.320</td>
                        <td class="cell-text-center">(주)네트웍스 파트너스</td>
                        <td class="cell-text-center">입주중</td>
                        <td class="col-active">1</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

<script src="auth.js"></script>
<script src="date8.js"></script>
<script>
// 층 숫자를 화면 표시용으로 변환: 음수=지하(B), 양수=지상
function floorLabel(f) {
    var n = parseInt(f, 10);
    if (isNaN(n) || n === 0) return '';
    return n < 0 ? ('B' + Math.abs(n)) : String(n);
}

// 한국 호수 규칙: 뒤 2자리=호, 나머지 앞자리=층 (예 440->4층, 1502->15층)
function deriveFloor(roomNo) {
    var s = String(roomNo || '').trim();
    if (/^(b|B|지하|-)/.test(s)) {              // 지하
        var bd = (s.match(/\d+/) || [''])[0];
        return bd ? -parseInt(bd.slice(0, 1), 10) : '';
    }
    var d = s.replace(/\D/g, '');
    if (!d) return '';
    if (d.length <= 2) return 1;                 // 한두자리 호실은 1층
    return parseInt(d.slice(0, -2), 10) || 1;
}

// 호실번호 입력 시 층 자동채움 (사용자가 직접 고친 경우는 건드리지 않음)
function autoFillFloor() {
    var fEl = document.getElementById('assignedFloor');
    if (fEl.dataset.userEdited === '1') return;
    var f = deriveFloor(document.getElementById('roomNumber').value);
    fEl.value = (f === '' ? '' : f);
}

async function handleAssetSubmit(event) {
    event.preventDefault();
    const name = document.getElementById('buildingName').value.trim();
    const addr = document.getElementById('actualAddress').value.trim();
    const roomNo0 = document.getElementById('roomNumber').value.trim();
    const floors = parseInt(document.getElementById('assignedFloor').value) || parseInt(deriveFloor(roomNo0)) || 1;
    const roomNo = document.getElementById('roomNumber').value.trim() || '';
    const area   = parseFloat(document.getElementById('roomArea').value) || 0;

    // 기존 건물 duplicate 체크
    try {
        const existingRes = await fetch('/api/v1/buildings');
        const existing = await existingRes.json();
        // 건물 식별은 '주소' 기준 (R1: 부동산 근원은 주소지). 같은 주소면 동일 건물로 보고 호실만 추가.
        const normAddr = a => (a || '').replace(/\s+/g, ' ').trim().toLowerCase();
        const key = normAddr(addr);
        let bldgId = null;
        for (const b of existing) {
            if (normAddr(b.address) === key) { bldgId = b.id; break; }
        }

        // 신규 등록
        if (!bldgId) {
            const postRes = await fetch('/api/v1/buildings', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({name, address:addr, floors})
            });
            const bldg = await postRes.json();
            if (!bldg.id) return alert('건물 등록 실패');
            bldgId = bldg.id;
        }

        // rooms 등록 (building_id=bldgId 고정)
        const roomPostUrl = `/api/v1/rooms?building_id=${bldgId}`;
        const r2 = await fetch('/api/v1/rooms', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({building_id:bldgId, floor_no:floors, room_no:roomNo, area_sqm:area, current_room_status:'비어있다'})
        });
        const room = await r2.json();
        if (!r2.ok || room.duplicate) {
            alert('⚠️ ' + (room.error || '등록 실패'));
            await loadBuildings();
            if (room.id) { var t = ALL_ROOMS_A.find(function(x){ return String(x.id)===String(room.id); }); if (t) selectRoomToForm(t, null); }
            return;
        }
        alert('✅ 완료 — 건물:' + name + ' / 호실:' + roomNo);
        clearRoomInputs();
        loadBuildings();
    } catch(e) {
        alert('등록 오류: ' + e.message);
    }
}

// 좌측 검색 → 같은 층 호실 버튼 (누르면 그 호실을 폼에 불러옴)
function renderLeftChips(q) {
    var box = document.getElementById('leftChips');
    var fl = guessFloorA(q);
    var kw = String(q || '').trim().toLowerCase();
    if (!kw) { box.innerHTML = ''; return; }
    var list = ALL_ROOMS_A.filter(function(r) {
        var f = (r.floor != null ? r.floor : r.floor_no);
        var no = String(r.room || r.room_no || '');
        return (fl !== null && !isNaN(fl) && String(f) === String(fl)) || no.toLowerCase().indexOf(kw) === 0;
    });
    if (!list.length) { box.innerHTML = '<span style="font-size:.76rem;color:#888">해당 호실이 없습니다</span>'; return; }
    box.innerHTML = '<div style="font-size:.74rem;color:#495057;font-weight:600;margin-bottom:4px">'
        + list.length + '개 — 누르면 왼쪽에 불러옵니다</div>'
        + list.map(function(r) {
            var no = String(r.room || r.room_no || '');
            var on = (String(document.getElementById('selectedRoomId').value) === String(r.id));
            return '<button type="button" onclick="pickLeftRoom(' + r.id + ')" style="margin:0 4px 4px 0;padding:4px 10px;'
                 + 'font-size:.82rem;font-weight:700;cursor:pointer;border:1px solid ' + (on ? '#28a745' : '#bbc4cc') + ';border-radius:5px;'
                 + 'background:' + (on ? '#28a745' : '#fff') + ';color:' + (on ? '#fff' : '#333') + '">' + no + '</button>';
        }).join('');
}

function pickLeftRoom(rid) {
    var rm = ALL_ROOMS_A.find(function(r){ return String(r.id) === String(rid); });
    if (!rm) return;
    selectRoomToForm(rm, null);
    renderLeftChips(document.getElementById('leftSearch').value);
}

// 상태 select에 기존값(임대중(단독층) 등)이 있으면 임시 옵션으로 추가해 데이터 보존
function setStatusSelect(val) {
    var sel = document.getElementById('roomStatus');
    var v = String(val || '공실');
    var has = Array.prototype.some.call(sel.options, function(o){ return o.value === v; });
    Array.prototype.slice.call(sel.querySelectorAll('option[data-legacy]')).forEach(function(o){ o.remove(); });
    if (!has) {
        var o = document.createElement('option');
        o.value = v; o.textContent = v + ' (기존값)'; o.setAttribute('data-legacy','1');
        sel.insertBefore(o, sel.firstChild);
    }
    sel.value = v;
}

// 표에서 행 클릭 → 좌측 폼에 자동 채움 (수정 모드)
function selectRoomToForm(rm, tr) {
    document.querySelectorAll('.excel-table-wrap tbody tr').forEach(function(r){ r.style.background=''; });
    if (tr) tr.style.background = '#fff3cd';

    document.getElementById('selectedRoomId').value = rm.id;
    document.getElementById('selectedBuildingId').value = rm.building_id || '';
    document.getElementById('buildingName').value = rm.building_name || '';
    document.getElementById('actualAddress').value = rm.building_address || '';
    document.getElementById('roomNumber').value = rm.room || rm.room_no || '';
    var fl = (rm.floor != null ? rm.floor : rm.floor_no);
    document.getElementById('assignedFloor').value = (fl == null ? '' : fl);
    document.getElementById('assignedFloor').dataset.userEdited = '1';   // 자동덮어쓰기 방지
    var ar = (rm.area != null ? rm.area : rm.area_sqm);
    document.getElementById('roomArea').value = (ar ? Number(ar) : '');
    setStatusSelect(rm.status || rm.current_room_status || '공실');

    var b = document.getElementById('editBanner');
    b.style.display = '';
    b.innerHTML = '✏️ <b>' + (rm.building_name||'') + ' ' + (rm.room||rm.room_no||'') + '</b> 수정 중 — 내용을 고치고 <b>[현황 변경 (수정)]</b>을 누르세요.';
}

function resetAssetForm() {
    document.getElementById('selectedRoomId').value = '';
    document.getElementById('selectedBuildingId').value = '';
    ['buildingName','actualAddress','roomNumber','assignedFloor','roomArea','roomStatus'].forEach(function(id){
        document.getElementById(id).value = '';
    });
    document.getElementById('assignedFloor').dataset.userEdited = '';
    document.getElementById('editBanner').style.display = 'none';
    document.querySelectorAll('.excel-table-wrap tbody tr').forEach(function(r){ r.style.background=''; });
}

// 현황 변경 (수정) — 선택한 호실 + 건물정보 갱신
async function handleAssetUpdate() {
    const roomId = document.getElementById('selectedRoomId').value;
    if (!roomId) return alert('먼저 오른쪽 목록에서 수정할 호실을 클릭하세요.');

    const bId    = document.getElementById('selectedBuildingId').value;
    const bName  = document.getElementById('buildingName').value.trim();
    const bAddr  = document.getElementById('actualAddress').value.trim();
    const roomNo = document.getElementById('roomNumber').value.trim();
    const floor  = parseInt(document.getElementById('assignedFloor').value, 10);
    const area   = parseFloat(document.getElementById('roomArea').value) || 0;
    const status = document.getElementById('roomStatus').value.trim();

    try {
        // 1) 건물명·주소가 바뀌었으면 건물도 갱신
        if (bId && (bName || bAddr)) {
            await fetch('/api/v1/buildings', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ id: parseInt(bId,10), name: bName, address: bAddr })
            });
        }
        // 2) 호실 갱신
        const res = await fetch('/api/v1/rooms', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                id: parseInt(roomId,10),
                floor_no: isNaN(floor) ? undefined : floor,
                room_no: roomNo,
                area_sqm: area,
                current_room_status: status
            })
        });
        const d = await res.json();
        if (res.ok) {
            alert('✅ 수정되었습니다. (' + (bName||'') + ' ' + roomNo + ')');
            resetAssetForm();
            loadBuildings();
        } else {
            alert('❌ 수정 실패: ' + (d.error || '알 수 없는 오류'));
        }
    } catch(e) { alert('❌ 통신 오류: ' + e.message); }
}

function clearRoomInputs() {
    document.getElementById('roomNumber').value = '';
    document.getElementById('roomArea').value = '';
    // 층 자동채움 재개(다음 호실 입력 대비): 사용자수정 플래그 해제하지 않음(같은 층 연속등록 편의)
    document.getElementById('roomNumber').focus();
}

// 층칸 직접 수정 감지
document.addEventListener('DOMContentLoaded', function(){
    var fEl = document.getElementById('assignedFloor');
    if (fEl) fEl.addEventListener('input', function(){ fEl.dataset.userEdited = '1'; });
});

var ALL_ROOMS_A = [];   // 호실 전체 (검색은 이걸로 즉시 필터)

// 호실번호에서 층 추정 (440 → 4층 / B101 → 지하1층)
function guessFloorA(q){
    q = String(q||'').trim(); if(!q) return null;
    if(/^[bB지]/.test(q)){ var bd=(q.match(/\d+/)||[''])[0]; return bd? -parseInt(bd.slice(0,1),10) : null; }
    var d = q.replace(/\D/g,''); if(!d) return null;
    return d.length>=3 ? parseInt(d.slice(0,-2),10) : parseInt(d,10);
}

async function loadBuildings(){
    try {
        const roomRes = await fetch('/api/v1/rooms');
        ALL_ROOMS_A = await roomRes.json() || [];
        renderRoomTable();
    } catch(e) { alert('불러오기 오류: ' + e.message); }
}

function renderRoomTable(){
    try {
        const kw = (document.getElementById('searchKeyword')?.value || '').trim().toLowerCase();
        const tbody = document.querySelector('.excel-table-wrap tbody');
        tbody.innerHTML = '';

        if (!ALL_ROOMS_A.length) {
            tbody.innerHTML = '<tr><td colspan="10" class="cell-text-center">등록된 호실이 없습니다.</td></tr>';
            return;
        }

        // 숫자만 입력하면 그 층 전체도 함께 표시
        const fl = kw ? guessFloorA(kw) : null;
        let matchCount = 0;

        for (const rm of ALL_ROOMS_A) {
            const bname = rm.building_name || '(건물 미지정)';
            const baddr = rm.building_address || '-';
            const roomNo = String(rm.room || rm.room_no || '');
            const areaVal = rm.area != null ? rm.area : rm.area_sqm;

            const rmFloor = (rm.floor != null ? rm.floor : rm.floor_no);
            const kwMatch = !kw ||
                bname.toLowerCase().includes(kw) ||
                baddr.toLowerCase().includes(kw) ||
                roomNo.toLowerCase().includes(kw) ||
                (fl !== null && !isNaN(fl) && String(rmFloor) === String(fl));   // 440 → 4층 전체
            if (!kwMatch) continue;

            const tr = document.createElement('tr');
            tr.style.cursor = 'pointer';
            tr.title = '클릭하면 왼쪽에서 수정할 수 있습니다';
            tr.onclick = function(){ selectRoomToForm(rm, tr); };
            tr.innerHTML = `
                <td class="col-no">${rm.id}</td>
                <td class="cell-text-center">${bname}</td>
                <td class="cell-text-center">${baddr}</td>
                <td class="cell-text-center">${floorLabel(rm.floor != null ? rm.floor : rm.floor_no)}</td>
                <td class="cell-text-center">${roomNo || '-'}</td>
                <td class="cell-num-right">${areaVal ? Number(areaVal).toFixed(3) : '-'}</td>
                <td class="cell-text-center">${roomNo ? `<button type="button" title="계약서·신분증 보기" onclick="event.stopPropagation(); openDocsByRoom('${roomNo}')" style="background:#f3f0fa;color:#5a2fb8;border:1px solid #d0bfff;padding:3px 9px;border-radius:3px;cursor:pointer;font-size:.75rem;font-weight:700">📄 서류</button>` : '-'}</td>
                <td class="cell-text-center">${rm.status || rm.current_room_status || '-'}</td>
                <td class="col-active">1</td>
                <td class="cell-text-center"><button type="button" style="background:#fd7e14;color:#fff;border:none;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:.75rem;font-weight:700">✏️ 수정</button></td>
            `;
            tbody.appendChild(tr);
            matchCount++;
        }

        if (!matchCount) {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td colspan="10" class="cell-text-center">검색 결과가 없습니다</td>';
            tbody.appendChild(tr);
        }
    } catch(e) { alert('불러오기 오류: ' + e.message); }
}

async function initLoadBuildings(){
    loadBuildings();
}

document.addEventListener('DOMContentLoaded', initLoadBuildings);
</script>
</body>
</html>
