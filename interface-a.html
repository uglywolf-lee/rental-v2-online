<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>부동산 자산 및 호실 관리 (엑셀 통합형)</title>
    <style>
        :root { 
            --primary: #28a745; 
            --border: #dee2e6; 
            --bg: #f8f9fa; 
            --text-dark: #495057;
            --text-muted: #6c757d;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;  
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: var(--bg); 
        }
        
        .left-panel { width: 35%; background: white; border-right: 1px solid var(--border); padding: 25px; overflow-y: auto; box-sizing: border-box; }
        .right-panel { width: 65%; padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; background: white; }
        .panel-title { font-size: 1.1rem; color: var(--primary); margin: 0 0 20px 0; border-bottom: 2px solid var(--primary); padding-bottom: 8px; font-weight: bold; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; color: var(--text-dark); }
        .form-control { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.88rem; box-sizing: border-box; }
        .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .btn-box { margin-top: 15px; display: flex; gap: 8px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 0.85rem; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-main { background: var(--primary); color: white; }
        .btn-sub { background: #6c757d; color: white; }
        
        .excel-table-wrap { flex: 0 1 auto; min-height: 0; overflow: auto; border: 1px solid #bbc4cc; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th { background: #f1f3f5; border: 1px solid #bbc4cc; padding: 6px 8px; font-weight: 600; position: sticky; top: 0; text-align: center; color: #212529; white-space: nowrap; }
        td { border: 1px solid #ced4da; padding: 4px 8px; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #e8f4fd; cursor: pointer; }
        
        .cell-text-center { text-align: center; }
        .cell-num-right { text-align: right; }
        
        .col-no { min-width: 45px; max-width: 60px; width: 50px; text-align: right; }
        .th-no { min-width: 45px; max-width: 60px; width: 50px; text-align: center; }
        .col-active { min-width: 55px; max-width: 70px; width: 60px; text-align: right; }
        .th-active { min-width: 55px; max-width: 70px; width: 60px; text-align: center; }
    </style>
<script src="guard.js"></script>
</head>
<body>

    <div class="left-panel">
        <div class="panel-title">🏠 A. 부동산/호실 인프라등록</div>
        <form onsubmit="handleAssetSubmit(event)">
            <div class="form-group">
                <label>건물명</label>
                <input type="text" class="form-control" id="buildingName" placeholder="예: 구로 디지털 타워 A동" required>
            </div>
            <div class="form-group">
                <label>실제 주소</label>
                <input type="text" class="form-control" id="actualAddress" placeholder="식별 및 연동 주소 입력" required>
            </div>
            <div class="form-group">
                <label>호실 번호</label>
                <input type="text" class="form-control" id="roomNumber" placeholder="예: 440 (4층 40호)" oninput="autoFillFloor()" required>
            </div>
            <div class="form-group">
                <label>층 <span style="font-weight:400;color:#888;">(호실번호에서 자동 · 지하/비정형이면 수정)</span></label>
                <input type="number" class="form-control" id="assignedFloor" placeholder="자동 산출">
            </div>
            <div class="form-group">
                <label>전용 면적 ㎡</label>
                <input type="number" step="0.001" class="form-control" id="roomArea" placeholder="소수점 3자리">
            </div>
            <div class="btn-box">
                <button type="submit" class="btn btn-main">신규 자산 등록</button>
                <button type="button" class="btn btn-sub" onclick="handleAssetUpdate()">현황 변경 (수정)</button>
            </div>
        </form>
    </div>

    <div class="right-panel">
        <div style="display: grid; grid-template-columns: 1fr auto; gap: 10px;">
            <input type="text" id="searchKeyword" class="form-control" placeholder="건물명, 주소, 호실 통합 검색...">
            <button class="btn btn-main" style="flex:none; width:80px;" onclick="loadBuildings()">검색</button>
        </div>
        <div class="excel-table-wrap">
            <table>
                <thead>
                    <tr>
                        <th class="th-no">No.</th>
                        <th>건물명</th>
                        <th>주소</th>
                        <th>층수</th>
                        <th>호실</th>
                        <th>면적 (㎡)</th>
                        <th>입주자 정보 (상호/성명)</th>
                        <th>상태</th>
                        <th class="th-active">활성</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="col-no">1</td>
                        <td class="cell-text-center">구로 테크노타운</td>
                        <td class="cell-text-center">서울시 구로구 디지털로 30길 12</td>
                        <td class="cell-text-center">2</td>
                        <td class="cell-text-center">201호</td>
                        <td class="cell-num-right">84.320</td>
                        <td class="cell-text-center">(주)네트웍스 파트너스</td>
                        <td class="cell-text-center">입주중</td>
                        <td class="col-active">1</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

<script src="auth.js"></script>
<script src="date8.js"></script>
<script>
// 층 숫자를 화면 표시용으로 변환: 음수=지하(B), 양수=지상
function floorLabel(f) {
    var n = parseInt(f, 10);
    if (isNaN(n) || n === 0) return '';
    return n < 0 ? ('B' + Math.abs(n)) : String(n);
}

// 한국 호수 규칙: 뒤 2자리=호, 나머지 앞자리=층 (예 440->4층, 1502->15층)
function deriveFloor(roomNo) {
    var s = String(roomNo || '').trim();
    if (/^(b|B|지하|-)/.test(s)) {              // 지하
        var bd = (s.match(/\d+/) || [''])[0];
        return bd ? -parseInt(bd.slice(0, 1), 10) : '';
    }
    var d = s.replace(/\D/g, '');
    if (!d) return '';
    if (d.length <= 2) return 1;                 // 한두자리 호실은 1층
    return parseInt(d.slice(0, -2), 10) || 1;
}

// 호실번호 입력 시 층 자동채움 (사용자가 직접 고친 경우는 건드리지 않음)
function autoFillFloor() {
    var fEl = document.getElementById('assignedFloor');
    if (fEl.dataset.userEdited === '1') return;
    var f = deriveFloor(document.getElementById('roomNumber').value);
    fEl.value = (f === '' ? '' : f);
}

async function handleAssetSubmit(event) {
    event.preventDefault();
    const name = document.getElementById('buildingName').value.trim();
    const addr = document.getElementById('actualAddress').value.trim();
    const roomNo0 = document.getElementById('roomNumber').value.trim();
    const floors = parseInt(document.getElementById('assignedFloor').value) || parseInt(deriveFloor(roomNo0)) || 1;
    const roomNo = document.getElementById('roomNumber').value.trim() || '';
    const area   = parseFloat(document.getElementById('roomArea').value) || 0;

    // 기존 건물 duplicate 체크
    try {
        const existingRes = await fetch('/api/v1/buildings');
        const existing = await existingRes.json();
        // 건물 식별은 '주소' 기준 (R1: 부동산 근원은 주소지). 같은 주소면 동일 건물로 보고 호실만 추가.
        const normAddr = a => (a || '').replace(/\s+/g, ' ').trim().toLowerCase();
        const key = normAddr(addr);
        let bldgId = null;
        for (const b of existing) {
            if (normAddr(b.address) === key) { bldgId = b.id; break; }
        }

        // 신규 등록
        if (!bldgId) {
            const postRes = await fetch('/api/v1/buildings', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({name, address:addr, floors})
            });
            const bldg = await postRes.json();
            if (!bldg.id) return alert('건물 등록 실패');
            bldgId = bldg.id;
        }

        // rooms 등록 (building_id=bldgId 고정)
        const roomPostUrl = `/api/v1/rooms?building_id=${bldgId}`;
        const r2 = await fetch('/api/v1/rooms', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({building_id:bldgId, floor_no:floors, room_no:roomNo, area_sqm:area, current_room_status:'비어있다'})
        });
        const room = await r2.json();
        alert('✅ 완료 — 건물:' + name + ' / 호실:' + roomNo);
        clearRoomInputs();
    } catch(e) {
        alert('등록 오류: ' + e.message);
    }
}

function handleAssetUpdate() {
    // TODO: 기존 건물/호실 수정 로직 (GET → PATCH)
    alert('⚠️ 현황 변경 기능은 다음 단계에서 구현됩니다.');
}

function clearRoomInputs() {
    document.getElementById('roomNumber').value = '';
    document.getElementById('roomArea').value = '';
    // 층 자동채움 재개(다음 호실 입력 대비): 사용자수정 플래그 해제하지 않음(같은 층 연속등록 편의)
    document.getElementById('roomNumber').focus();
}

// 층칸 직접 수정 감지
document.addEventListener('DOMContentLoaded', function(){
    var fEl = document.getElementById('assignedFloor');
    if (fEl) fEl.addEventListener('input', function(){ fEl.dataset.userEdited = '1'; });
});

async function loadBuildings(){
    try {
        const kw = (document.getElementById('searchKeyword')?.value || '').trim().toLowerCase();
        
        const roomRes = await fetch('/api/v1/rooms');
        const allRooms = await roomRes.json() || [];
        if (!allRooms.length) { alert('등록된 호실이 없습니다.'); return; }

        const tbody = document.querySelector('.excel-table-wrap tbody');
        tbody.innerHTML = '';

        let matchCount = 0;

        // 호실 기준 렌더 — 건물정보는 rooms API의 building_id 조인 결과를 그대로 사용.
        // 건물명이 아니라 FK로 묶이므로 주소/호실이 잘못 묶이거나 분리되지 않는다.
        for (const rm of allRooms) {
            const bname = rm.building_name || '(건물 미지정)';
            const baddr = rm.building_address || '-';
            const roomNo = String(rm.room || rm.room_no || '');
            const areaVal = rm.area != null ? rm.area : rm.area_sqm;

            const kwMatch = !kw ||
                bname.toLowerCase().includes(kw) ||
                baddr.toLowerCase().includes(kw) ||
                roomNo.toLowerCase().includes(kw);
            if (!kwMatch) continue;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-no">${rm.id}</td>
                <td class="cell-text-center">${bname}</td>
                <td class="cell-text-center">${baddr}</td>
                <td class="cell-text-center">${floorLabel(rm.floor != null ? rm.floor : rm.floor_no)}</td>
                <td class="cell-text-center">${roomNo || '-'}</td>
                <td class="cell-num-right">${areaVal ? Number(areaVal).toFixed(3) : '-'}</td>
                <td class="cell-text-center">-</td>
                <td class="cell-text-center">${rm.status || rm.current_room_status || '-'}</td>
                <td class="col-active">1</td>
            `;
            tbody.appendChild(tr);
            matchCount++;
        }

        if (!matchCount) {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td colspan="9" class="cell-text-center">검색 결과가 없습니다</td>';
            tbody.appendChild(tr);
        }
    } catch(e) { alert('불러오기 오류: ' + e.message); }
}

async function initLoadBuildings(){
    loadBuildings();
}

document.addEventListener('DOMContentLoaded', initLoadBuildings);
</script>
</body>
</html>
