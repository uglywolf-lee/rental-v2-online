<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>되돌리기 (수정 이력 복구)</title>
<script src="guard.js"></script>
<style>
  :root{--primary:#6f42c1;--border:#dee2e6;--bg:#f8f9fa;--danger:#dc3545;--muted:#6c757d;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Malgun Gothic','Segoe UI',sans-serif;height:100vh;overflow-y:auto;background:var(--bg);padding:24px}
  .wrap{max-width:1000px;margin:0 auto;background:#fff;border-radius:8px;padding:24px 28px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
  h1{font-size:1.3rem;color:var(--primary);border-bottom:2px solid var(--primary);padding-bottom:10px;margin-bottom:10px}
  .hint{font-size:.88rem;color:var(--muted);margin-bottom:16px;line-height:1.55}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th{background:#f1eefb;border:1px solid var(--border);padding:9px;text-align:center;font-weight:700;position:sticky;top:0}
  td{border:1px solid var(--border);padding:8px 10px;text-align:center}
  .btn{border:none;border-radius:5px;padding:8px 16px;font-size:.88rem;font-weight:bold;cursor:pointer}
  .btn-undo{background:var(--primary);color:#fff}
  .btn-undo:hover{background:#5a32a3}
  .btn-refresh{background:var(--muted);color:#fff;padding:8px 14px}
  .done{color:var(--muted);font-size:.84rem}
  .none{color:var(--muted);padding:18px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>↩ 되돌리기 (수정 이력 복구)</h1>
    <div class="hint">데이터를 수정하기 <b>직전 상태</b>가 자동으로 저장됩니다. 실수로 바꿨을 때 아래에서 그 시점으로 <b>되돌리기</b> 하면 원래대로 복구됩니다. (최근 300건)</div>
    <div class="bar">
      <div id="cnt" class="done"></div>
      <button class="btn btn-refresh" onclick="load()">새로고침</button>
    </div>
    <table>
      <thead><tr><th>시각</th><th>대상</th><th>번호</th><th>상태</th><th>되돌리기</th></tr></thead>
      <tbody id="tb"><tr><td colspan="5" class="none">불러오는 중…</td></tr></tbody>
    </table>
  </div>
<script>
var LABEL = {contacts:'연락처/직원', contracts:'계약', bills:'공과금', rooms:'호실', incidents:'유지보수'};
async function load(){
  var tb=document.getElementById('tb');
  try{
    var r=await fetch('/api/v1/snapshots'); var list=await r.json()||[];
    document.getElementById('cnt').textContent='총 '+list.length+'건';
    if(!list.length){ tb.innerHTML='<tr><td colspan="5" class="none">저장된 수정 이력이 없습니다.</td></tr>'; return; }
    tb.innerHTML='';
    list.forEach(function(s){
      var restored = (s.is_restored==1 || s.is_restored===true);
      var btn = restored ? '<span class="done">복구됨</span>'
        : '<button class="btn btn-undo" onclick="undo('+s.id+')">↩ 되돌리기</button>';
      tb.insertAdjacentHTML('beforeend',
        '<tr><td>'+(s.created_at||'-')+'</td><td>'+(LABEL[s.table_name]||s.table_name||'-')+'</td><td>'+(s.target_id||'-')+'</td><td>'+(restored?'복구됨':'수정 전 저장')+'</td><td>'+btn+'</td></tr>');
    });
  }catch(e){ tb.innerHTML='<tr><td colspan="5" class="none">불러오기 오류</td></tr>'; }
}
async function undo(id){
  if(!confirm('이 시점의 상태로 되돌리시겠습니까?')) return;
  try{
    var r=await fetch('/api/v1/snapshots/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})});
    var d=await r.json();
    if(r.ok){ alert('✅ '+(d.message||'되돌리기 완료')); load(); }
    else alert('❌ '+(d.error||'되돌리기 실패'));
  }catch(e){ alert('❌ 통신 오류: '+e.message); }
}
document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
