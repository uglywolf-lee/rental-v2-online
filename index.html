<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부동산 관리시스템 로그인</title>
<style>
  body { display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#f0f2f5;font-family:'Segoe UI',sans-serif }
  .box { background:#fff;padding:30px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12);width:340px }
  h2 { margin:-30px -30px 20px;text-align:center;color:#fff;background:#3498db;padding:15px;border-radius:8px 8px 0 0 }
  input { width:100%;padding:10px;margin-bottom:12px;border:1px solid #dde;border-radius:4px;box-sizing:border-box }
  button { width:100%;background:#3498db;color:#fff;padding:11px 0;border:none;border-radius:4px;cursor:pointer;font-size:1rem }
  button:hover { background:#2980b9 }
  .login-contact { text-align:center; margin-top:16px; font-size:13px; color:#6b7280; }
  .login-contact a { color:#3498db; text-decoration:none }
  .login-net { text-align:center; margin-top:10px; font-size:12.5px; color:#555; background:#eef3f8; padding:8px 10px; border-radius:6px; }
  .login-net b { color:#2c85d1; }
</style>
</head>
<body>
<div class="box">
  <h2>🏢 부동산 관리시스템 로그인</h2>
  <input id="empNo" placeholder="아이디 (이메일)" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('password').focus();}">
  <input id="password" type="password" placeholder="비밀번호 (6자 이상)" onkeydown="if(event.key==='Enter'){event.preventDefault();doLogin();}">
  <button onclick="doLogin()">로그인</button>
</div>
<div class="login-contact">문의: <a href="mailto:uglywolf@gmail.com">uglywolf@gmail.com</a></div>
<div class="login-net" id="serverAddr"></div>
<script>
fetch('/api/v1/serverinfo').then(function(r){return r.json();}).then(function(d){
  var el = document.getElementById('serverAddr');
  if (el && d && d.ip) { el.innerHTML = '📡 다른 기기에서 접속: <b>http://' + d.ip + ':' + d.port + '</b>'; }
}).catch(function(){});
</script>
<script>
function doLogin(){
  var emp = document.getElementById('empNo').value.trim();
  var pw  = document.getElementById('password').value.trim();
  if(!emp||!pw){alert('사번과 비밀번호를 입력하세요.');return;}
  
  // 규칙 40 기반 비밀번호 최소 자릿수 유효성 차단
  if(pw.length <6) { alert('비밀번호는 최소 6자 이상이어야 합니다.'); return; }

  // 서버 API로 로그인 요청 (fetch 연동)
  fetch('/api/v1/auth/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({emp: emp, password: pw})
  })
  .then(r => r.json())
  .then(data => {
    // 서버는 실패 시 {status:'error', message}, 성공 시 {status:'success', user:{...}} 를 반환
    if (data.status === 'error' || data.error) {
      alert(data.message || data.error || '로그인에 실패했습니다.');
      return;
    }
    var u = data.user || {};
    sessionStorage.setItem('loginOk','true');
    sessionStorage.setItem('userEmp', u.employee_no || data.emp || emp);
    sessionStorage.setItem('userRole', u.role || data.role || 'office_worker');
    sessionStorage.setItem('_sess', Date.now());
    location.href='main.html';
  })
  .catch(e => { alert('로그인 에러: ' + e.message); });
}
</script>
</body>
</html>
