<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>팀원·권한 관리자 등록 (사무인력 전용)</title>
    <style>
        :root { 
            --primary: #0d6efd; 
            --border: #dee2e6; 
            --bg: #f8f9fa; 
            --text-dark: #495057;
            --text-muted: #6c757d;
            --danger: #dc3545;
            --success: #198754;
            --warning: #ffc107;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            background-color: var(--bg); 
        }
        .left-panel { width: 35%; background: white; border-right: 1px solid var(--border); padding: 25px; overflow-y: auto; }
        .right-panel { width: 65%; display: flex; flex-direction: column; }
        .panel-title { font-size: 1.1rem; color: var(--primary); margin: 0 0 20px 0; border-bottom: 2px solid var(--primary); padding-bottom: 8px; font-weight: bold; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; color: var(--text-dark); }
        .form-control { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.88rem; box-sizing: border-box; }
        .btn-box { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        .btn-row { display: flex; gap: 8px; width: 100%; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 0.85rem; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-main { background: var(--primary); color: white; }
        .btn-warn { background: var(--warning); color: #212529; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-tab-search { flex: none; width: 80px; }
        .right-tabs { width: 100%; padding: 0 20px; background: #e9ecef; display: flex; gap: 4px; }
        .right-tab { padding: 8px 16px; font-size: 0.85rem; font-weight: bold; color: var(--primary); background: white; border-radius: 4px 4px 0 0; border-bottom: 2px solid var(--primary); user-select: none; }
        .tab-body { flex: 1; padding: 20px; overflow-y: auto; background: white; }
        .tab-search-box { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 15px; }
        .alert-box { padding: 8px 12px; border-radius: 4px; margin-bottom: 15px; font-size: 0.78rem; line-height: 1.4; }
        .alert-info { background: #cfe2ff; color: #084298; border-left: 3px solid var(--primary); }
        .alert-warn { background: #fff3cd; color: #664d03; border-left: 3px solid var(--warning); }
        .excel-table-wrap { overflow: auto; border: 1px solid #bbc4cc; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th { background: #f1f3f5; border: 1px solid #bbc4cc; padding: 6px 8px; font-weight: 600; position: sticky; top: 0; text-align: center; white-space: nowrap; }
        td { border: 1px solid #ced4da; padding: 4px 8px; white-space: nowrap; color: #333; }
        tr:nth-child(even) { background-color: var(--bg); }
        tr:hover { background-color: #e2e6ea; cursor: pointer; }
        .cell-text-center { text-align: center; } 
        .cell-num-right { text-align: right; }    
        .status-active { color: var(--success); font-weight: bold; }
        .status-inactive { color: var(--danger); font-weight: bold; }
        .col-emp-id { min-width: 65px; max-width: 80px; width: 70px; text-align: right; }
        .th-emp-id { min-width: 65px; max-width: 80px; width: 70px; text-align: center; }
    </style>
<script src="guard.js"></script>
</head>
<body>

    <div class="left-panel">
        <div class="panel-title">👤 J. 팀원등록/권한관리</div>
        <form id="teamMemberForm" onsubmit="event.preventDefault(); submitTeamMember();">
            <div class="alert-box alert-info">💡 보안: 비밀번호는 DB에 안전하게 저장됩니다. (마스터: EMP-001 / admin123)</div>

            <input type="hidden" id="selectedContactId" value="">

            <div class="form-group">
                <label>사번 (고용번호)</label>
                <input type="text" id="u_empId" class="form-control" placeholder="예: 001 또는 EMP-002" required>
            </div>
            <div class="form-group">
                <label>실제 성명</label>
                <input type="text" id="u_empName" class="form-control" placeholder="홍길동" required>
            </div>
            <div class="form-group">
                <label>접속 비밀번호 (암호 유실 완벽 방지)</label>
                <input type="password" id="u_empPw" class="form-control" placeholder="신규 등록 및 암호 변경 시 입력" required>
            </div>

            <div class="alert-box alert-warn">⚠️ 역할변경 시 즉시권한적용 — 신중하게작업</div>

            <div class="form-group">
                <label>역할 구분 (role 지정필수)</label>
                <select id="u_empRole" class="form-control" required>
                    <option value="">역할선택하세요 (필수)</option>
                    <option value="super_admin">최상위권한자 (전체관리/설정변경가능)</option>
                    <option value="office_worker" selected>사무인력 (계약수정/조회만가능)</option>
                    <option value="maintenance_staff">유지보수직원등록/관리자 (신고접수만가능)</option>
                </select>
            </div>

            <div class="btn-box">
                <div class="btn-row">
                    <button type="submit" class="btn btn-main">조직원 등록 / 직무 저장</button>
                    <button type="button" class="btn btn-danger" onclick="suspendDuty()">🚫 최고관리자: 해당 직무 정지</button>
                </div>
                <button type="button" class="btn btn-warn" onclick="forceChangePassword()">🔑 최고관리자: 비밀번호 강제 변경</button>
            </div>
        </form>
    </div>

    <div class="right-panel">
        <div class="right-tabs">
            <div class="right-tab">팀원명부현황</div>
        </div>

        <div class="tab-body">
            <div class="tab-search-box">
                <input type="text" id="teamSearchKw" class="form-control" placeholder="성명 또는 사번으로 시트검색..." onkeyup="filterTeamList()">
                <button type="button" class="btn btn-main btn-tab-search" onclick="filterTeamList()">현황조회</button>
            </div>
            <div class="excel-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th class="th-emp-id">사원번호</th>
                            <th>직책명</th><th>실명</th><th>역할종류</th><th>접속 비밀번호</th><th>사용상태</th>
                        </tr>
                    </thead>
                    <tbody id="teamTableTbody">
                        <tr>
                            <td colspan="6" class="cell-text-center">데이터를 불러오는 중입니다...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script src="date8.js"></script>
<script>
var ALL_TEAM_MEMBERS = [];

function getRoleLabel(role) {
    if (role === 'super_admin') return '최상위권한자';
    if (role === 'office_worker') return '사무인력';
    if (role === 'maintenance_staff') return '유지보수직원';
    return role || '일반사원';
}

// 1. DB에서 팀원 명부 로드
async function loadTeamMembers() {
    try {
        var res = await fetch('/api/v1/contacts?category=staff');
        var data = await res.json() || [];
        
        ALL_TEAM_MEMBERS = data.map(function(item) {
            return {
                id: item.id,
                emp_no: item.rep || item.representative_name || 'EMP-000',
                name: item.company_or_name || item.name || '미등록',
                role: item.role || 'office_worker',
                password_hash: item.password_hash || '****',
                status: (item.is_active == '0' || item.is_active === false) ? '정지됨' : '활성화됨'
            };
        });

        renderTeamTable(ALL_TEAM_MEMBERS);
    } catch(e) {
        console.error('[팀원 로드 에러]', e);
    }
}

// 2. 우측 테이블 렌더링
function renderTeamTable(list) {
    var tbody = document.getElementById('teamTableTbody');
    tbody.innerHTML = '';

    if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="cell-text-center">등록된 팀원이 없습니다.</td></tr>';
        return;
    }

    list.forEach(function(item) {
        var tr = document.createElement('tr');
        tr.onclick = function() { selectMemberToForm(item); };

        var statusClass = item.status === '활성화됨' ? 'status-active' : 'status-inactive';

        tr.innerHTML = `
            <td class="col-emp-id">${item.emp_no}</td>
            <td class="cell-text-center">${getRoleLabel(item.role)}</td>
            <td class="cell-text-center"><b>${item.name}</b></td>
            <td class="cell-text-center">${item.role}</td>
            <td class="cell-text-center" style="color:#666;">${item.password_hash}</td>
            <td class="cell-text-center"><span class="${statusClass}">${item.status}</span></td>
        `;
        tbody.appendChild(tr);
    });
}

function selectMemberToForm(item) {
    document.getElementById('selectedContactId').value = item.id;
    document.getElementById('u_empId').value = item.emp_no;
    document.getElementById('u_empName').value = item.name;
    document.getElementById('u_empRole').value = item.role;
    document.getElementById('u_empPw').value = item.password_hash;
}

function filterTeamList() {
    var kw = document.getElementById('teamSearchKw').value.toLowerCase().trim();
    var filtered = ALL_TEAM_MEMBERS.filter(function(m) {
        var str = (m.emp_no + ' ' + m.name + ' ' + m.role).toLowerCase();
        return !kw || str.includes(kw);
    });
    renderTeamTable(filtered);
}

// 🌟 3. 신규 팀원 등록 (비밀번호 password_hash 및 role 정상 전송)
async function submitTeamMember() {
    var empId = document.getElementById('u_empId').value.trim();
    var empName = document.getElementById('u_empName').value.trim();
    var empPw = document.getElementById('u_empPw').value.trim();
    var empRole = document.getElementById('u_empRole').value;

    if (!empId || !empName || !empPw || !empRole) {
        return alert('❌ 모든 필드(사번, 성명, 비밀번호, 역할)를 입력해 주세요.');
    }

    var payload = {
        category: 'staff',
        company_or_name: empName,
        representative_name: empId,
        contact_info: '010-0000-0000',
        email: '',
        password_hash: empPw, // 🌟 비밀번호 포함 유실 방지
        role: empRole         // 🌟 역할 별도 저장
    };

    try {
        var res = await fetch('/api/v1/contacts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if (res.ok) {
            alert(`✅ [${empName} (사번: ${empId})] 팀원이 DB에 정상 저장되었습니다!`);
            document.getElementById('teamMemberForm').reset();
            loadTeamMembers();
        }
    } catch(e) {
        alert('❌ 통신 오류: ' + e.message);
    }
}

// 🌟 4. 직무 정지 (DB UPDATE is_active=0 실제 연동)
async function suspendDuty() {
    var cid = document.getElementById('selectedContactId').value;
    var empName = document.getElementById('u_empName').value || '해당 사원';
    
    if (!cid) return alert('❌ 하단 목록에서 직무 정지할 사원을 먼저 클릭 선택하세요.');

    if (!confirm(`⚠️ [${empName}] 사원의 직무를 정지(is_active=0) 처리하시겠습니까?`)) return;

    try {
        var res = await fetch('/api/v1/contacts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id: cid, is_active: '0' })
        });
        if (res.ok) {
            alert(`🚫 [${empName}] 사원의 접근 권한이 정지 처리되었습니다.`);
            loadTeamMembers();
        }
    } catch(e) {
        alert('❌ 통신 오류: ' + e.message);
    }
}

// 🌟 5. 비밀번호 강제 변경 (DB UPDATE password_hash 실제 연동)
async function forceChangePassword() {
    var cid = document.getElementById('selectedContactId').value;
    var empName = document.getElementById('u_empName').value;
    var newPw = document.getElementById('u_empPw').value.trim();

    if (!cid || !newPw) {
        return alert('❌ 하단 목록에서 대상 사원을 클릭 후 새로운 비밀번호를 입력하세요.');
    }

    try {
        var res = await fetch('/api/v1/contacts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id: cid, password_hash: newPw })
        });
        if (res.ok) {
            alert(`🔑 [${empName}] 사원의 접속 비밀번호가 성공적으로 강제 변경되었습니다!`);
            loadTeamMembers();
        }
    } catch(e) {
        alert('❌ 통신 오류: ' + e.message);
    }
}

document.addEventListener('DOMContentLoaded', loadTeamMembers);
</script>
</body>
</html>
